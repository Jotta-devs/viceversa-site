<script>
(function(){
  /* ---- Google Analytics: eventos do site. Só registra se o gtag carregou
     (bloqueador de anúncios, por exemplo, impede) — nunca quebra a página. ---- */
  function evento(nome, dados){
    try {
      if(typeof window.gtag !== "function") return;
      const limpo = {};
      Object.keys(dados || {}).forEach(function(k){
        if(dados[k] !== undefined && dados[k] !== null && dados[k] !== "") limpo[k] = dados[k];
      });
      window.gtag("event", nome, limpo);
    } catch(e){}
  }
  const artigoAtual = document.querySelector(".artigo[data-post]");
  const localAtual = document.querySelector(".artigo[data-local]");
  const idPost = artigoAtual ? artigoAtual.dataset.post : (localAtual ? localAtual.dataset.local : undefined);
  const tipoConteudo = artigoAtual ? "noticia" : (localAtual ? "local_mapa" : "pagina");

  /* ---- Sugestão de idioma (detecção do navegador, não força nada) ---- */
  (function(){
    var CHAVE = "viceversa_idioma_escolha"; // "aceito" | "recusado" | ausente

    var jaEscolheu = false;
    try { jaEscolheu = !!localStorage.getItem(CHAVE); } catch (e) {}
    if (jaEscolheu) return;

    var atualLink = document.querySelector('.seletor-idioma a.idioma-atual');
    if (!atualLink) return;
    var idiomaAtual = (atualLink.getAttribute('hreflang') || '').toLowerCase();

    // idiomas do navegador, na ordem de preferência da pessoa
    var prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || ''];

    function normalizar(tag) { return (tag || '').toLowerCase(); }
    function raiz(tag) { return normalizar(tag).split('-')[0]; }

    // entre os links do seletor, acha o primeiro cujo idioma bate com a preferência do navegador
    var opcoes = Array.prototype.slice.call(document.querySelectorAll('.seletor-idioma a'));
    var sugestao = null;
    for (var i = 0; i < prefs.length && !sugestao; i++) {
      var p = normalizar(prefs[i]);
      for (var j = 0; j < opcoes.length; j++) {
        var hl = normalizar(opcoes[j].getAttribute('hreflang'));
        if (hl === p || raiz(hl) === raiz(p)) { sugestao = opcoes[j]; break; }
      }
    }

    // nada a sugerir se o navegador já fala o idioma da página atual
    if (!sugestao || raiz(sugestao.getAttribute('hreflang')) === raiz(idiomaAtual)) return;

    // Mensagens fixas, escritas no idioma SUGERIDO (não no idioma da página
    // atual) — é o idioma que a pessoa efetivamente consegue ler. Por isso
    // isso vive aqui em JS puro, e não em idiomas/*.json: teria que existir
    // nas 3 traduções ao mesmo tempo, para qualquer página de origem.
    var MSGS = {
      "en":    { texto: "This site is also available in English.",        ir: "View in English",     nao: "No, thanks" },
      "pt-br": { texto: "Este site também está disponível em português.", ir: "Ver em português",    nao: "Não, obrigado" },
      "es":    { texto: "Este sitio también está disponible en español.", ir: "Ver en español",      nao: "No, gracias" }
    };
    var alvo = raiz(sugestao.getAttribute("hreflang"));
    var msg = MSGS[sugestao.getAttribute("hreflang").toLowerCase()] || MSGS[alvo] || MSGS["en"];

    var barra = document.getElementById("barra-idioma");
    var txt = document.getElementById("barra-idioma-txt");
    var ir = document.getElementById("barra-idioma-ir");
    var nao = document.getElementById("barra-idioma-nao");
    if (!barra || !txt || !ir || !nao) return;

    txt.textContent = msg.texto;
    ir.textContent = msg.ir;
    ir.href = sugestao.getAttribute("href");
    nao.textContent = msg.nao;
    barra.classList.add("mostrar");

    ir.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "aceito"); } catch (e) {}
    });
    nao.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "recusado"); } catch (e) {}
      barra.classList.remove("mostrar");
    });
  })();

  /* ---- Menu overlay ---- */
  const painel = document.getElementById("menu-painel");
  const fundo  = document.getElementById("menu-fundo");
  const abrir  = document.getElementById("abrir-menu");
  const fechar = document.getElementById("fechar-menu");
  if(painel && abrir){
    let focoAnterior = null;
    function abrirMenu(){
      focoAnterior = document.activeElement;
      document.body.classList.add("menu-aberto");
      document.body.style.overflow = "hidden";
      fundo.hidden = false;
      painel.setAttribute("aria-hidden","false");
      abrir.setAttribute("aria-expanded","true");
      const p = painel.querySelector(".menu-links a");
      if(p) p.focus();
    }
    function fecharMenu(){
      document.body.classList.remove("menu-aberto");
      document.body.style.overflow = "";
      painel.setAttribute("aria-hidden","true");
      abrir.setAttribute("aria-expanded","false");
      setTimeout(function(){ fundo.hidden = true; }, 360);
      if(focoAnterior) focoAnterior.focus();
    }
    abrir.addEventListener("click", abrirMenu);
    if(fechar) fechar.addEventListener("click", fecharMenu);
    fundo.addEventListener("click", fecharMenu);
    document.addEventListener("keydown", function(ev){
      if(ev.key === "Escape" && document.body.classList.contains("menu-aberto")) fecharMenu();
    });
    /* prende o foco dentro do painel enquanto ele estiver aberto */
    painel.addEventListener("keydown", function(ev){
      if(ev.key !== "Tab") return;
      const f = painel.querySelectorAll("a[href], button");
      if(!f.length) return;
      const primeiro = f[0], ultimo = f[f.length-1];
      if(ev.shiftKey && document.activeElement === primeiro){ ev.preventDefault(); ultimo.focus(); }
      else if(!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primeiro.focus(); }
    });
  }

  /* ---- Alternador de movimento ---- */
  const btnMov = document.getElementById("btn-movimento");
  if(btnMov){
    btnMov.addEventListener("click", function(){
      const ligado = btnMov.getAttribute("aria-pressed") === "true";
      btnMov.setAttribute("aria-pressed", ligado ? "false" : "true");
      document.body.classList.toggle("sem-movimento", ligado);
    });
  }

  function reduzMovimento(){
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch(e){ return false; } // API indisponível neste navegador: assume que animação é ok
  }
  const reduzido = reduzMovimento();

  /* ---- Ticker: duplicar faixa para loop perfeito ---- */
  const faixa = document.getElementById("faixa");
  if(faixa) faixa.innerHTML += faixa.innerHTML;

  /* ---- Contagem regressiva ---- */
  const alvo = new Date("2026-11-19T00:00:00-03:00").getTime();
  const el = {
    d: document.getElementById("cd-dias"),
    h: document.getElementById("cd-horas"),
    m: document.getElementById("cd-min"),
    s: document.getElementById("cd-seg")
  };
  function poe(campo, valor){
    if(campo.textContent !== valor){
      campo.textContent = valor;
      if(!reduzido){
        campo.classList.remove("pop");
        void campo.offsetWidth; /* reinicia a animação */
        campo.classList.add("pop");
      }
    }
  }
  function tick(){
    if(!el.d) return;
    const diff = alvo - Date.now();
    if(diff <= 0){
      poe(el.d,"00"); poe(el.h,"00"); poe(el.m,"00"); poe(el.s,"00");
      document.querySelector(".contagem__label").textContent = "{{cd01}}";
      return;
    }
    poe(el.d, String(Math.floor(diff/86400000)));
    poe(el.h, String(Math.floor(diff%86400000/3600000)).padStart(2,"0"));
    poe(el.m, String(Math.floor(diff%3600000/60000)).padStart(2,"0"));
    poe(el.s, String(Math.floor(diff%60000/1000)).padStart(2,"0"));
  }
  if(el.d){ tick(); setInterval(tick, 1000); }

  /* ---- Estrelas e vagalumes gerados ---- */
  const _estrelas = document.getElementById("estrelas");
  if(!reduzido && _estrelas){
    const estrelas = _estrelas;
    for(let i=0;i<36;i++){
      const s = document.createElement("i");
      s.style.left = Math.random()*100 + "%";
      s.style.top = Math.random()*55 + "%";
      s.style.animationDelay = (Math.random()*4) + "s";
      s.style.animationDuration = (2.5 + Math.random()*4) + "s";
      s.style.opacity = .2 + Math.random()*.6;
      estrelas.appendChild(s);
    }
    const vaga = document.getElementById("vagalumes");
    for(let i=0;i<7;i++){
      const v = document.createElement("i");
      v.style.left = (5 + Math.random()*90) + "%";
      v.style.top = (35 + Math.random()*55) + "%";
      v.style.animationDelay = (Math.random()*14) + "s";
      v.style.animationDuration = (10 + Math.random()*10) + "s";
      vaga.appendChild(v);
    }
  }

  /* ---- Glitch periódico no título ---- */
  const glitch = document.getElementById("glitch");
  if(!reduzido && glitch){
    setInterval(function(){
      if(Math.random() < .55){
        glitch.classList.add("ativo");
        setTimeout(function(){ glitch.classList.remove("ativo"); }, 380);
      }
    }, 3200);
  }

  /* ---- Revelação no scroll ---- */
  const obs = new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add("visivel");
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.12});
  document.querySelectorAll(".observa").forEach(function(s){ obs.observe(s); });

  /* ---- Tilt 3D nos cards de notícia (desktop, mouse) ---- */
  const podeTilt = !reduzido && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if(podeTilt){
    document.querySelectorAll(".tilt").forEach(function(card){
      let raf = null;
      card.addEventListener("pointermove", function(ev){
        if(raf) return; /* no máximo 1 atualização por frame */
        raf = requestAnimationFrame(function(){
          const r = card.getBoundingClientRect();
          const x = (ev.clientX - r.left) / r.width - .5;
          const y = (ev.clientY - r.top) / r.height - .5;
          card.style.transform = "perspective(900px) rotateY(" + (x*6) + "deg) rotateX(" + (-y*6) + "deg) translateY(-3px)";
          raf = null;
        });
      });
      card.addEventListener("pointerleave", function(){
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        card.style.transform = "";
      });
    });
  }

  /* ---- Pausa as animações do hero quando ele sai da tela ---- */
  const hero = document.querySelector("header.hero");
  if(hero) new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      hero.classList.toggle("pausado", !e.isIntersecting);
    });
  }, {threshold:0}).observe(hero);


  /* ---- Anúncios: a biblioteca já carrega pelo <head> (tag do Google).
     Aqui só ativamos, um a um, os blocos manuais que já têm um ID de anúncio
     real preenchido — os que ainda estão com data-ad-slot vazio continuam
     ocultos até você criar o bloco no AdSense e preencher idiomas/*.json. */
  (function(){
    const slots = document.querySelectorAll("[data-anuncio]");
    if(!slots.length) return;

    const prontos = Array.prototype.filter.call(slots, function(s){
      const ins = s.querySelector("ins.adsbygoogle");
      return ins && ins.dataset.adSlot && ins.dataset.adSlot.trim() !== "";
    });
    if(!prontos.length) return; // nenhum bloco com ID ainda: nada a fazer

    const obs = new IntersectionObserver(function(entradas){
      entradas.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.remove("anuncio--vazio");
        try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(err){}
        obs.unobserve(e.target);
      });
    }, {rootMargin: "600px"});
    prontos.forEach(function(s){ obs.observe(s); });
  })();

  /* ---- Mapa de Leonida (recriado em vetor pelo VICEVERSA, Leaflet) ----
     Ver mapa/recriar_mapa.py. O SVG não traz cores: a paleta (Noite/Dia) vem
     do CSS. Pontos, categorias e confirmados sem posição: mapa/pontos.json. */
  (function(){
    const alvo = document.getElementById("atlas-mapa");
    const cfgEl = document.getElementById("atlas-config");
    const caixa = document.getElementById("atlas");
    if(!alvo || !cfgEl || !caixa || typeof L === "undefined") return;

    let cfg;
    try { cfg = JSON.parse(cfgEl.textContent); } catch(e){ return; }
    if(!cfg || !cfg.info) return;
    const info = cfg.info, pontos = cfg.pontos || [], txt = cfg.textos || {};
    const cats = cfg.categorias || [];
    const W = info.largura, H = info.altura;
    const CAT = {};
    cats.forEach(function(c){ CAT[c.id] = c; });
    function catDe(p){ return CAT[p.cat] || CAT.marco || {id: p.cat, cor: "#FFD23F", icone: "estrela", nome: p.cat, singular: p.cat}; }

    /* ícones dos marcadores (traço branco sobre o círculo colorido) */
    const ICONES = {
      predios: '<path d="M4 21V10h6v11M10 21V4h7v17M17 21v-7h3v7M3 21h18M12.5 8h2M12.5 12h2M12.5 16h2"/>',
      aviao:   '<path d="M10.5 14.5L3 12l1-2 7.5 1L15 4.5c.8-1 2.5-1.4 3.2-.7.7.7.3 2.4-.7 3.2L12 10.5 13 18l-2 1-2.5-7.5"/>',
      ancora:  '<circle cx="12" cy="5" r="2"/><path d="M12 7v14M8 11h8M5 14c0 4 3 7 7 7s7-3 7-7"/>',
      praia:   '<path d="M12 21v-9M12 12C11 8 7 7 4 8c3 0 6 2 8 4zM12 12c1-4 5-5 8-4-3 0-6 2-8 4zM12 12c-2-3-2-7 0-9 2 2 2 6 0 9zM5 21h14"/>',
      pantano: '<path d="M6 20V9M10 20V5M14 20V8M18 20v-9M4 20h16M6 9l-2-2M10 5l2-2M14 8l2-2M18 11l2-2"/>',
      arvore:  '<path d="M12 3l6 8h-3.5l4.5 6H5l4.5-6H6zM12 17v4"/>',
      agua:    '<path d="M12 3s-5 5.5-5 9a5 5 0 0 0 10 0c0-3.5-5-9-5-9zM9.5 13.5a2.5 2.5 0 0 0 2.5 2.5"/>',
      fabrica: '<path d="M3 21V11l5 3v-3l5 3v-3l5 3V4h3v17zM3 21h18M7 17h2M12 17h2"/>',
      ponte:   '<path d="M2 15h20M4 15v5M20 15v5M3 15c3-6 15-6 18 0M8 11.3V15M12 10.5V15M16 11.3V15"/>',
      estrela: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
      camera:  '<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.5"/>',
      loja:    '<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',
      carro:   '<path d="M3 16v-4l2.5-5h13L21 12v4zM3 16v2h3v-2M18 16v2h3v-2M3 12h18"/><circle cx="7.5" cy="14" r=".6"/><circle cx="16.5" cy="14" r=".6"/>',
      musica:  '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
      casa:    '<path d="M3 11l9-7 9 7M5 9.5V21h5v-6h4v6h5V9.5"/>'
    };
    function svgIcone(nome){
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONES[nome] || ICONES.estrela) + '</svg>';
    }
    function escapar(s){ const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function normalizar(s){ return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

    /* fichas já traduzidas pelo gerador (textos m10…m67) */
    const fichas = {};
    document.querySelectorAll("#mapa-dados [data-r]").forEach(function(el){
      fichas[el.dataset.r] = {
        nome: el.dataset.nome, real: el.dataset.real,
        tags: (el.dataset.tags || "").split("|").filter(Boolean),
        desc: el.textContent.trim()
      };
    });
    pontos.forEach(function(p){
      const f = p.ficha && fichas[p.ficha];
      if(f){
        p.nome = p.nome || f.nome; p.real = p.real || f.real;
        p.desc = p.desc || f.desc; p.tags = p.tags || f.tags;
      }
      p.tags = p.tags || [];
    });
    const porId = {};
    pontos.forEach(function(p){ porId[p.id] = p; });

    /* ── visitados: ficam salvos só neste navegador ── */
    const CHAVE_VIS = "viceversa_mapa_visitados";
    let visitados = new Set();
    try { visitados = new Set(JSON.parse(localStorage.getItem(CHAVE_VIS) || "[]")); } catch(e){}
    function salvarVisitados(){ try { localStorage.setItem(CHAVE_VIS, JSON.stringify(Array.from(visitados))); } catch(e){} }

    /* ── mapa em pixels (CRS.Simple): 1 unidade = 1 px do mapa no zoom Z ── */
    const Z = Math.max(0, Math.ceil(Math.log2(Math.max(W, H) / 256)));
    const mapa = L.map(alvo, {
      crs: L.CRS.Simple, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90,
      attributionControl: true, zoomControl: false, maxBoundsViscosity: 0.8
    });
    L.control.zoom({position: "bottomright"}).addTo(mapa);
    function paraLatLng(fx, fy){ return mapa.unproject([fx * W, fy * H], Z); }
    function paraFracao(latlng){ const p = mapa.project(latlng, Z); return [p.x / W, p.y / H]; }
    const limites = L.latLngBounds(paraLatLng(0, 1), paraLatLng(1, 0));
    mapa.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    mapa.setMaxBounds(limites.pad(0.2));
    function enquadrar(){ mapa.fitBounds(limites, {padding: [12, 12]}); }
    enquadrar();
    mapa.setMinZoom(mapa.getZoom() - 0.5);
    mapa.setMaxZoom(Z + 3);

    /* espessura das linhas e tamanho dos rótulos acompanham o zoom */
    function porZoom(){
      const rel = mapa.getZoom() - mapa.getMinZoom();
      caixa.style.setProperty("--traco", (0.7 + rel * 0.35).toFixed(2));
      caixa.dataset.zoom = rel < 1.2 ? "longe" : rel < 2.6 ? "medio" : "perto";
    }
    mapa.on("zoomend", porZoom); porZoom();

    /* ── base: o vetor recriado, no estilo Noite ou Dia ── */
    fetch(cfg.svg).then(function(r){ return r.text(); }).then(function(t){
      const tmp = document.createElement("div");
      tmp.innerHTML = t;
      const el = tmp.querySelector("svg");
      if(!el) return;
      el.setAttribute("preserveAspectRatio", "none");
      L.svgOverlay(el, limites, {interactive: false, className: "atlas-vetor"}).addTo(mapa).bringToBack();
    });

    const botaoEstilo = document.getElementById("atlas-estilo");
    let estiloAtual = "noite";
    function aplicarEstilo(estilo){
      estiloAtual = estilo;
      caixa.classList.remove("atlas--noite", "atlas--dia");
      caixa.classList.add("atlas--" + estilo);
      if(botaoEstilo){
        const proximo = estilo === "noite" ? botaoEstilo.dataset.dia : botaoEstilo.dataset.noite;
        botaoEstilo.title = proximo || ""; botaoEstilo.setAttribute("aria-label", proximo || "");
      }
      try { localStorage.setItem("viceversa_mapa_estilo", estilo); } catch(e){}
    }
    try {
      const salvo = localStorage.getItem("viceversa_mapa_estilo");
      if(salvo === "dia" || salvo === "noite") estiloAtual = salvo;
    } catch(e){}
    aplicarEstilo(estiloAtual);
    if(botaoEstilo) botaoEstilo.addEventListener("click", function(){
      aplicarEstilo(estiloAtual === "noite" ? "dia" : "noite");
      evento("mapa_estilo", {estilo: estiloAtual});
    });

    /* ── grade de referência (A1…H11) ── */
    const botaoGrade = document.getElementById("atlas-grade");
    const cel = info.grade ? info.grade.celula : 0;
    function quadrante(p){
      if(!cel) return "";
      const col = Math.min(info.grade.colunas - 1, Math.floor(p.x * W / cel));
      const lin = Math.min(info.grade.linhas - 1, Math.floor(p.y * H / cel));
      return String.fromCharCode(65 + col) + (lin + 1);
    }
    if(botaoGrade){
      if(!cel) botaoGrade.hidden = true;
      botaoGrade.addEventListener("click", function(){
        const ligada = botaoGrade.getAttribute("aria-pressed") === "true";
        if(!ligada) evento("mapa_grade");
        botaoGrade.setAttribute("aria-pressed", ligada ? "false" : "true");
        caixa.classList.toggle("atlas--grade", !ligada);
      });
    }

    /* ── janela do local (popup no próprio mapa) ── */
    function rotuloNome(p){
      return {oficial: txt.oficial, descritivo: txt.descritivo, comunidade: txt.comunidade}[p.nome_tipo] || "";
    }
    function htmlPopup(p){
      const c = catDe(p);
      const vis = visitados.has(p.id);
      const q = quadrante(p);
      let h = '<div class="pop" style="--cor:' + c.cor + '">';
      h += '<div class="pop__topo"><span class="pop__cat">' + svgIcone(p.icone || c.icone) + escapar(c.singular) + '</span>';
      if(q) h += '<span class="pop__quad">' + escapar(txt.quadrante) + ' ' + q + '</span>';
      h += '</div><h4>' + escapar(p.nome) + '</h4>';
      if(p.real) h += '<p class="pop__real">' + escapar(txt.inspirado) + ' <strong>' + escapar(p.real) + '</strong></p>';
      if(p.desc) h += '<p class="pop__desc">' + escapar(p.desc) + '</p>';
      const selos = [];
      if(rotuloNome(p)) selos.push('<span class="pop__selo pop__selo--' + escapar(p.nome_tipo) + '">' + escapar(rotuloNome(p)) + '</span>');
      if(p.aprox) selos.push('<span class="pop__selo pop__selo--aprox">' + escapar(txt.aprox) + '</span>');
      p.tags.forEach(function(t){ selos.push('<span class="pop__selo">' + escapar(t) + '</span>'); });
      if(selos.length) h += '<div class="pop__selos">' + selos.join("") + '</div>';
      h += '<div class="pop__acoes">';
      if(p.cat !== "regiao") h += '<button type="button" class="pop__vis" data-acao="visitado" aria-pressed="' + vis + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
        escapar(vis ? txt.visitado : txt.marcar) + '</button>';
      h += '<button type="button" data-acao="zoom">' + escapar(txt.aproximar) + '</button>';
      h += '<button type="button" data-acao="copiar">' + escapar(txt.copiar) + '</button>';
      h += '</div>';
      const links = [];
      if(p.url && txt.pagina) links.push('<a class="pop__pagina" href="' + escapar(p.url) + '" data-evento="pagina_local" data-local="popup_mapa">' + escapar(txt.pagina) + '</a>');
      if(p.video) links.push('<a href="https://www.youtube.com/watch?v=' + encodeURIComponent(p.video) +
        (p.t ? "&t=" + parseInt(p.t, 10) + "s" : "") + '" target="_blank" rel="noopener">' + escapar(txt.video) + '</a>');
      if(links.length) h += '<p class="pop__links">' + links.join("") + '</p>';
      if(p.fontes && p.fontes.length){
        h += '<p class="pop__fontes">' + escapar(txt.fontes) + ': ' + p.fontes.map(function(f){
          let host = f; try { host = new URL(f).hostname.replace(/^www\./, ""); } catch(e){}
          return '<a href="' + escapar(f) + '" target="_blank" rel="noopener nofollow">' + escapar(host) + '</a>';
        }).join(", ") + '</p>';
      }
      return h + '</div>';
    }

    /* ── marcadores: regiões viram nomes grandes; o resto, ícones por categoria ── */
    const marcadores = {};
    function iconePara(p){
      const c = catDe(p);
      if(p.cat === "regiao"){
        return L.divIcon({className: "atlas-regiao", iconSize: null,
          html: '<b>' + escapar(p.nome) + '</b><small>' + escapar(p.real) + '</small>'});
      }
      const classes = "atlas-pin" + (p.aprox ? " atlas-pin--aprox" : "") + (visitados.has(p.id) ? " atlas-pin--visitado" : "");
      return L.divIcon({className: classes, iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -14],
        html: '<span style="--cor:' + c.cor + '">' + svgIcone(p.icone || c.icone) + '</span>'});
    }
    pontos.forEach(function(p){
      const m = L.marker(paraLatLng(p.x, p.y), {icon: iconePara(p), title: p.nome, alt: p.nome, keyboard: true, riseOnHover: true});
      if(p.cat !== "regiao") m.bindTooltip(p.nome, {direction: "top", offset: [0, -16], className: "atlas-dica"});
      m.bindPopup(function(){ return htmlPopup(p); }, {className: "atlas-popup", maxWidth: 320, minWidth: 250, autoPanPaddingTopLeft: [20, 70], autoPanPaddingBottomRight: [60, 20]});
      m.on("popupopen", function(e){ aoAbrir(p, m, e.popup); });
      m.on("popupclose", function(){
        document.querySelectorAll(".atlas .ativo").forEach(function(n){ n.classList.remove("ativo"); });
        if(location.hash.replace("#", "") === p.id && history.replaceState) history.replaceState(null, "", location.pathname + location.search);
      });
      marcadores[p.id] = m;
    });
    /* rótulos soltos (água etc.): só texto, sem clique */
    const rotulos = L.layerGroup();
    (cfg.rotulos || []).forEach(function(r){
      L.marker(paraLatLng(r.x, r.y), {interactive: false, keyboard: false,
        icon: L.divIcon({className: "atlas-rotulo atlas-rotulo--" + r.tipo, html: escapar(r.nome), iconSize: null})
      }).addTo(rotulos);
    });

    function aoAbrir(p, m, popup){
      evento("mapa_local", {local_id: p.id, categoria: p.cat});
      document.querySelectorAll(".atlas .ativo").forEach(function(n){ n.classList.remove("ativo"); });
      if(m._icon) m._icon.classList.add("ativo");
      document.querySelectorAll('#atlas-cats [data-id="' + p.id + '"]').forEach(function(b){ b.classList.add("ativo"); });
      if(history.replaceState) history.replaceState(null, "", "#" + p.id);
      const raiz = popup.getElement();
      if(!raiz) return;
      raiz.querySelectorAll("[data-acao]").forEach(function(b){
        b.addEventListener("click", function(){
          const acao = b.dataset.acao;
          if(acao === "zoom"){
            mapa.flyTo(paraLatLng(p.x, p.y), Math.min(mapa.getMaxZoom(), Math.max(mapa.getZoom() + 1.5, mapa.getMinZoom() + 3)), {duration: .6});
          } else if(acao === "copiar"){
            const link = location.href.split("#")[0] + "#" + p.id;
            evento("share", {method: "copiar_link", content_type: "mapa_local", item_id: p.id});
            const pronto = function(){ b.textContent = txt.copiado; setTimeout(function(){ b.textContent = txt.copiar; }, 2000); };
            if(navigator.clipboard) navigator.clipboard.writeText(link).then(pronto).catch(function(){});
          } else if(acao === "visitado"){
            alternarVisitado(p.id);
            m.setPopupContent(htmlPopup(p));
            aoAbrir(p, m, popup);
          }
        });
      });
    }

    /* ── visibilidade: categoria ligada e (opcional) esconder visitados ── */
    const ligadas = {};
    cats.forEach(function(c){ ligadas[c.id] = true; });
    const ocultarVis = document.getElementById("atlas-ocultar-visitados");
    function visivel(p){
      return ligadas[p.cat] !== false && !(ocultarVis && ocultarVis.checked && visitados.has(p.id) && p.cat !== "regiao");
    }
    function atualizarMapa(){
      pontos.forEach(function(p){
        const m = marcadores[p.id];
        const deve = visivel(p);
        if(deve && !mapa.hasLayer(m)) m.addTo(mapa);
        if(!deve && mapa.hasLayer(m)){ m.closePopup(); mapa.removeLayer(m); }
      });
      if(ligadas.regiao !== false) rotulos.addTo(mapa); else mapa.removeLayer(rotulos);
    }

    /* ── lista lateral: categorias com caixa de seleção, contagem e locais ── */
    const listaCats = document.getElementById("atlas-cats");
    const progresso = document.getElementById("atlas-progresso");
    const textoProgresso = progresso ? progresso.textContent : "";
    function locaisDa(cat){
      return pontos.filter(function(p){ return p.cat === cat; })
        .sort(function(a, b){ return (a.nome || "").localeCompare(b.nome || ""); });
    }
    function montarCategorias(){
      if(!listaCats) return;
      listaCats.innerHTML = "";
      cats.forEach(function(c){
        const itens = locaisDa(c.id);
        if(!itens.length) return;
        const bloco = document.createElement("div");
        bloco.className = "cat"; bloco.style.setProperty("--cor", c.cor); bloco.dataset.cat = c.id;
        const vistos = itens.filter(function(p){ return visitados.has(p.id); }).length;
        const conta = c.id === "regiao" || !vistos ? String(itens.length) : vistos + "/" + itens.length;
        bloco.innerHTML =
          '<div class="cat__linha">' +
            '<label><input type="checkbox"' + (ligadas[c.id] !== false ? " checked" : "") + '>' +
            '<i class="cat__icone">' + (c.id === "regiao" ? '<b>Aa</b>' : svgIcone(c.icone)) + '</i>' +
            '<span class="cat__nome">' + escapar(c.nome) + '</span></label>' +
            '<span class="cat__conta' + (vistos && c.id !== "regiao" ? ' cat__conta--vis' : '') + '">' + conta + '</span>' +
            '<button type="button" class="cat__abrir" aria-expanded="false" aria-label="' + escapar(c.nome) + '">' +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>' +
          '</div><ul class="cat__itens" hidden></ul>';
        const ul = bloco.querySelector(".cat__itens");
        itens.forEach(function(p){
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button"; b.dataset.id = p.id;
          if(visitados.has(p.id)) b.classList.add("visitado");
          b.innerHTML = '<span>' + escapar(p.nome) + '</span><small>' + escapar([p.real, quadrante(p)].filter(Boolean).join(" · ")) + '</small>';
          b.addEventListener("click", function(){ selecionar(p); });
          li.appendChild(b); ul.appendChild(li);
        });
        bloco.querySelector("input").addEventListener("change", function(e){
          ligadas[c.id] = e.target.checked;
          evento("mapa_categoria", {categoria: c.id, ligada: e.target.checked});
          atualizarMapa();
        });
        const abrir = bloco.querySelector(".cat__abrir");
        abrir.addEventListener("click", function(){
          const aberto = abrir.getAttribute("aria-expanded") === "true";
          abrir.setAttribute("aria-expanded", aberto ? "false" : "true");
          ul.hidden = aberto;
        });
        listaCats.appendChild(bloco);
      });
      const total = pontos.filter(function(p){ return p.cat !== "regiao"; }).length;
      const vistosTotal = pontos.filter(function(p){ return p.cat !== "regiao" && visitados.has(p.id); }).length;
      if(progresso) progresso.textContent = (vistosTotal ? vistosTotal + "/" + total + " " + txt.visitados + " · " : "") + textoProgresso;
    }
    function alternarVisitado(id){
      if(visitados.has(id)) visitados.delete(id); else visitados.add(id);
      salvarVisitados();
      evento("mapa_visitado", {local_id: id, visitado: visitados.has(id)});
      const p = porId[id], m = marcadores[id];
      if(p && m){
        m.setIcon(iconePara(p));
        if(m.isPopupOpen() && m._icon) m._icon.classList.add("ativo");
      }
      const abertos = Array.from(document.querySelectorAll('#atlas-cats .cat__abrir[aria-expanded="true"]'))
        .map(function(b){ return b.closest(".cat").dataset.cat; });
      montarCategorias();
      abertos.forEach(function(c){
        const b = document.querySelector('#atlas-cats .cat[data-cat="' + c + '"] .cat__abrir');
        if(b) b.click();
      });
      if(ocultarVis && ocultarVis.checked) atualizarMapa();
    }
    montarCategorias();
    atualizarMapa();
    if(ocultarVis) ocultarVis.addEventListener("change", atualizarMapa);
    document.querySelectorAll(".atlas__massa [data-todos]").forEach(function(b){
      b.addEventListener("click", function(){
        const ligar = b.dataset.todos === "1";
        cats.forEach(function(c){ ligadas[c.id] = ligar; });
        listaCats.querySelectorAll(".cat__linha input").forEach(function(i){ i.checked = ligar; });
        atualizarMapa();
      });
    });

    /* ── gaveta lateral no celular ── */
    const botaoLado = document.getElementById("atlas-abrir-lado");
    function abrirLado(abrir){
      caixa.classList.toggle("atlas--lado-aberto", abrir);
      if(botaoLado) botaoLado.setAttribute("aria-expanded", abrir ? "true" : "false");
    }
    if(botaoLado) botaoLado.addEventListener("click", function(){ abrirLado(!caixa.classList.contains("atlas--lado-aberto")); });
    const botaoFechar = document.getElementById("atlas-fechar");
    if(botaoFechar) botaoFechar.addEventListener("click", function(){ abrirLado(false); });
    const telaPequena = window.matchMedia("(max-width: 960px)");

    /* ── selecionar um local (lista, busca, link direto) ── */
    function selecionar(p){
      if(ligadas[p.cat] === false){
        ligadas[p.cat] = true;
        const i = listaCats.querySelector('.cat[data-cat="' + p.cat + '"] input');
        if(i) i.checked = true;
      }
      if(ocultarVis && ocultarVis.checked && visitados.has(p.id)){ ocultarVis.checked = false; }
      atualizarMapa();
      if(telaPequena.matches) abrirLado(false);
      const m = marcadores[p.id];
      const zoom = p.cat === "regiao" ? mapa.getMinZoom() + 1.5 : Math.max(mapa.getZoom(), mapa.getMinZoom() + 2.25);
      mapa.flyTo(paraLatLng(p.x, p.y), zoom, {duration: .6});
      mapa.once("moveend", function(){ if(m) m.openPopup(); });
    }

    /* ── busca: nomes, inspiração, descrição e etiquetas ── */
    const busca = document.getElementById("atlas-busca");
    const resultados = document.getElementById("atlas-resultados");
    pontos.forEach(function(p){
      p._busca = normalizar([p.nome, p.real, p.desc, p.tags.join(" "), quadrante(p), catDe(p).nome].join(" "));
    });
    function buscar(){
      const q = normalizar(busca.value.trim());
      resultados.innerHTML = "";
      resultados.hidden = !q;
      if(!q) return;
      const achados = pontos.filter(function(p){ return p._busca.indexOf(q) !== -1; });
      if(!achados.length){
        const li = document.createElement("li"); li.className = "atlas__vazio"; li.textContent = txt.nada;
        resultados.appendChild(li); return;
      }
      achados.forEach(function(p){
        const c = catDe(p);
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button"; b.style.setProperty("--cor", c.cor);
        b.innerHTML = '<i>' + (p.cat === "regiao" ? "" : svgIcone(p.icone || c.icone)) + '</i><span>' + escapar(p.nome) +
          '</span><small>' + escapar(c.singular) + '</small>';
        b.addEventListener("click", function(){ selecionar(p); });
        li.appendChild(b); resultados.appendChild(li);
      });
    }
    if(busca){
      busca.addEventListener("input", buscar);
      let esperaBusca;
      busca.addEventListener("input", function(){
        clearTimeout(esperaBusca);
        const termo = busca.value.trim();
        if(termo.length >= 3) esperaBusca = setTimeout(function(){
          evento("search", {search_term: termo.toLowerCase(), local: "mapa"});
        }, 1500);
      });
      busca.addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        const primeiro = resultados.querySelector("button");
        if(primeiro){ e.preventDefault(); primeiro.click(); }
      });
    }

    /* ── confirmados sem posição: o botão leva até a região ── */
    document.querySelectorAll(".atlas__confirmados [data-ir]").forEach(function(b){
      b.addEventListener("click", function(){
        const p = porId[b.dataset.ir];
        if(p) selecionar(p);
      });
    });
    document.querySelectorAll(".atlas__confirmados .confirmado").forEach(function(li){
      const i = li.querySelector(".confirmado__cor");
      if(i) i.innerHTML = svgIcone(li.dataset.icone || "estrela");
    });

    /* ── tela cheia e enquadrar ── */
    document.getElementById("atlas-enquadrar").addEventListener("click", function(){ mapa.closePopup(); enquadrar(); });
    document.getElementById("atlas-tela").addEventListener("click", function(){
      const cheia = caixa.classList.toggle("atlas--cheia");
      if(cheia) evento("mapa_tela_cheia");
      document.body.classList.toggle("atlas-aberto", cheia);
      if(cheia && caixa.requestFullscreen) caixa.requestFullscreen().catch(function(){});
      if(!cheia && document.fullscreenElement) document.exitFullscreen().catch(function(){});
      setTimeout(function(){ mapa.invalidateSize(); }, 200);
    });
    document.addEventListener("fullscreenchange", function(){
      if(!document.fullscreenElement && caixa.classList.contains("atlas--cheia")){
        caixa.classList.remove("atlas--cheia");
        document.body.classList.remove("atlas-aberto");
        setTimeout(function(){ mapa.invalidateSize(); }, 200);
      }
    });

    /* ── link direto: /map/#vice-city abre já no local ── */
    function abrirDoEndereco(){
      const id = decodeURIComponent(location.hash.replace("#", ""));
      const p = porId[id];
      if(p && !(marcadores[id] && marcadores[id].isPopupOpen())) selecionar(p);
    }
    abrirDoEndereco();
    window.addEventListener("hashchange", abrirDoEndereco);

    /* ── modo de edição: /map/?editar=1 mostra a posição de cada clique ── */
    if(/[?&]editar=1/.test(location.search)){
      const coord = document.getElementById("atlas-coord");
      coord.hidden = false; coord.textContent = txt.editar;
      mapa.on("click", function(e){
        const f = paraFracao(e.latlng);
        const linha = '"x": ' + f[0].toFixed(4) + ', "y": ' + f[1].toFixed(4);
        coord.textContent = linha;
        L.popup().setLatLng(e.latlng).setContent("<code>" + linha + "</code>").openOn(mapa);
        if(navigator.clipboard) navigator.clipboard.writeText(linha).catch(function(){});
      });
    }
  })();

  /* ---- Plantão: os cards são gerados pelo montar.py (HTML estático, indexável).
     Aqui só removemos imagens que não carregarem, para não deixar ícone quebrado. ---- */
  document.querySelectorAll(".post-auto img, .artigo__corpo img, .noticia__img").forEach(function(im){
    im.addEventListener("error", function(){
      const pai = im.parentElement;
      im.remove();
      if(pai && pai.tagName === "A" && !pai.textContent.trim()) pai.remove();
    });
  });

  /* ---- Filtro da página de notícias: Todas / GTA 6 / Off.
     Os botões só existem se houver notícia "off"; sem JS, tudo continua visível.
     O endereço guarda a escolha: /news/#off abre já filtrado. ---- */
  (function(){
    const filtro = document.querySelector(".filtro");
    if(!filtro) return;
    const secao = filtro.closest("section") || document;
    const itens = secao.querySelectorAll("[data-categoria]");
    const vazio = secao.querySelector(".filtro__vazio");
    const cards = secao.querySelectorAll(".feed-auto [data-categoria]");
    const botoes = filtro.querySelectorAll("[data-filtro]");
    function aplicar(valor, registrar){
      if(!["todas", "gta", "off"].includes(valor)) valor = "todas";
      botoes.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.filtro === valor)); });
      itens.forEach(function(el){ el.hidden = valor !== "todas" && el.dataset.categoria !== valor; });
      if(vazio) vazio.hidden = !Array.prototype.every.call(cards, function(c){ return c.hidden; });
      if(registrar){
        const hash = valor === "todas" ? "" : "#" + valor;
        history.replaceState(null, "", location.pathname + location.search + hash);
        evento("filtro_noticias", {categoria: valor});
      }
    }
    botoes.forEach(function(b){
      b.addEventListener("click", function(){ aplicar(b.dataset.filtro, true); });
    });
    filtro.hidden = false;
    aplicar(location.hash.replace("#", ""), false);
  })();

  /* ---- Compartilhar: menu nativo no celular, copiar link no desktop ---- */
  document.querySelectorAll("[data-compartilhar]").forEach(function(b){
    if(!navigator.share){ b.style.display = "none"; return; }
    b.addEventListener("click", function(){
      evento("share", {method: "nativo", content_type: tipoConteudo, item_id: idPost});
      navigator.share({title: document.title, url: b.dataset.compartilhar}).catch(function(){});
    });
  });
  document.querySelectorAll("[data-copiar]").forEach(function(b){
    b.addEventListener("click", function(){
      const original = b.textContent;
      const pronto = function(){
        b.textContent = b.dataset.ok || original;
        setTimeout(function(){ b.textContent = original; }, 2000);
      };
      evento("share", {method: "copiar_link", content_type: tipoConteudo, item_id: idPost});
      if(navigator.clipboard){
        navigator.clipboard.writeText(b.dataset.copiar).then(pronto).catch(function(){});
      }
    });
  });

  /* ---- Analytics: cliques que mostram o que traz leitor de volta e o que vende ---- */
  function secaoDe(el){
    const s = el.closest("section[id], header, footer, nav, main, aside");
    return s ? (s.id || s.className.split(" ")[0] || s.tagName.toLowerCase()) : "";
  }
  document.addEventListener("click", function(ev){
    const el = ev.target.closest("a, button");
    if(!el) return;
    const href = el.getAttribute("href") || "";
    if(el.dataset.rede && el.closest(".compartilhar")){
      evento("share", {method: el.dataset.rede, content_type: tipoConteudo, item_id: idPost});
    } else if(el.dataset.evento){
      evento(el.dataset.evento, {canal: el.dataset.canal, local: el.dataset.local, item_id: idPost});
    } else if(/kiwify\.com/i.test(href)){
      evento("clique_ebook", {local: secaoDe(el)});
    } else if(el.closest(".artigo__relacionadas")){
      evento("clique_relacionada", {item_id: idPost});
    } else if(el.hasAttribute("hreflang")){
      evento("troca_idioma", {idioma: el.getAttribute("hreflang")});
    } else {
      const rede = (href.match(/^https?:\/\/(?:www\.)?(x\.com|twitter\.com|instagram\.com|tiktok\.com|youtube\.com|t\.me|whatsapp\.com)/i) || [])[1];
      if(rede) evento("clique_rede", {rede: rede.toLowerCase().replace(/\.com$/, ""), local: secaoDe(el)});
    }
  });

  /* ---- Analytics: leitura completa (o fim do texto apareceu depois de 10 s na página) ---- */
  const corpoArtigo = document.querySelector(".artigo__corpo");
  if(corpoArtigo && "IntersectionObserver" in window){
    const fim = document.createElement("span");
    fim.setAttribute("aria-hidden", "true");
    corpoArtigo.appendChild(fim);
    setTimeout(function(){
      const obs = new IntersectionObserver(function(entradas){
        if(entradas.some(function(e){ return e.isIntersecting; })){
          evento("leitura_completa", {item_id: idPost});
          obs.disconnect();
        }
      });
      obs.observe(fim);
    }, 10000);
  }
})();
</script>
</body>
</html>
