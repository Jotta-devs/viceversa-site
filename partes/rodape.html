<script>
(function(){
  /* ---- Sugestão de idioma (detecção do navegador, não força nada) ---- */
  (function(){
    var CHAVE = "viceversa_idioma_escolha"; // "aceito" | "recusado" | ausente

    var jaEscolheu = false;
    try { jaEscolheu = !!localStorage.getItem(CHAVE); } catch (e) {}
    if (jaEscolheu) return;

    var atualLink = document.querySelector('.seletor-idioma a.idioma-atual');
    if (!atualLink) return;
    var idiomaAtual = (atualLink.getAttribute('hreflang') || '').toLowerCase();

    // idiomas do navegador, na ordem de preferência da pessoa
    var prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || ''];

    function normalizar(tag) { return (tag || '').toLowerCase(); }
    function raiz(tag) { return normalizar(tag).split('-')[0]; }

    // entre os links do seletor, acha o primeiro cujo idioma bate com a preferência do navegador
    var opcoes = Array.prototype.slice.call(document.querySelectorAll('.seletor-idioma a'));
    var sugestao = null;
    for (var i = 0; i < prefs.length && !sugestao; i++) {
      var p = normalizar(prefs[i]);
      for (var j = 0; j < opcoes.length; j++) {
        var hl = normalizar(opcoes[j].getAttribute('hreflang'));
        if (hl === p || raiz(hl) === raiz(p)) { sugestao = opcoes[j]; break; }
      }
    }

    // nada a sugerir se o navegador já fala o idioma da página atual
    if (!sugestao || raiz(sugestao.getAttribute('hreflang')) === raiz(idiomaAtual)) return;

    // Mensagens fixas, escritas no idioma SUGERIDO (não no idioma da página
    // atual) — é o idioma que a pessoa efetivamente consegue ler. Por isso
    // isso vive aqui em JS puro, e não em idiomas/*.json: teria que existir
    // nas 3 traduções ao mesmo tempo, para qualquer página de origem.
    var MSGS = {
      "en":    { texto: "This site is also available in English.",        ir: "View in English",     nao: "No, thanks" },
      "pt-br": { texto: "Este site também está disponível em português.", ir: "Ver em português",    nao: "Não, obrigado" },
      "es":    { texto: "Este sitio también está disponible en español.", ir: "Ver en español",      nao: "No, gracias" }
    };
    var alvo = raiz(sugestao.getAttribute("hreflang"));
    var msg = MSGS[sugestao.getAttribute("hreflang").toLowerCase()] || MSGS[alvo] || MSGS["en"];

    var barra = document.getElementById("barra-idioma");
    var txt = document.getElementById("barra-idioma-txt");
    var ir = document.getElementById("barra-idioma-ir");
    var nao = document.getElementById("barra-idioma-nao");
    if (!barra || !txt || !ir || !nao) return;

    txt.textContent = msg.texto;
    ir.textContent = msg.ir;
    ir.href = sugestao.getAttribute("href");
    nao.textContent = msg.nao;
    barra.classList.add("mostrar");

    ir.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "aceito"); } catch (e) {}
    });
    nao.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "recusado"); } catch (e) {}
      barra.classList.remove("mostrar");
    });
  })();

  /* ---- Menu overlay ---- */
  const painel = document.getElementById("menu-painel");
  const fundo  = document.getElementById("menu-fundo");
  const abrir  = document.getElementById("abrir-menu");
  const fechar = document.getElementById("fechar-menu");
  if(painel && abrir){
    let focoAnterior = null;
    function abrirMenu(){
      focoAnterior = document.activeElement;
      document.body.classList.add("menu-aberto");
      document.body.style.overflow = "hidden";
      fundo.hidden = false;
      painel.setAttribute("aria-hidden","false");
      abrir.setAttribute("aria-expanded","true");
      const p = painel.querySelector(".menu-links a");
      if(p) p.focus();
    }
    function fecharMenu(){
      document.body.classList.remove("menu-aberto");
      document.body.style.overflow = "";
      painel.setAttribute("aria-hidden","true");
      abrir.setAttribute("aria-expanded","false");
      setTimeout(function(){ fundo.hidden = true; }, 360);
      if(focoAnterior) focoAnterior.focus();
    }
    abrir.addEventListener("click", abrirMenu);
    if(fechar) fechar.addEventListener("click", fecharMenu);
    fundo.addEventListener("click", fecharMenu);
    document.addEventListener("keydown", function(ev){
      if(ev.key === "Escape" && document.body.classList.contains("menu-aberto")) fecharMenu();
    });
    /* prende o foco dentro do painel enquanto ele estiver aberto */
    painel.addEventListener("keydown", function(ev){
      if(ev.key !== "Tab") return;
      const f = painel.querySelectorAll("a[href], button");
      if(!f.length) return;
      const primeiro = f[0], ultimo = f[f.length-1];
      if(ev.shiftKey && document.activeElement === primeiro){ ev.preventDefault(); ultimo.focus(); }
      else if(!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primeiro.focus(); }
    });
  }

  /* ---- Alternador de movimento ---- */
  const btnMov = document.getElementById("btn-movimento");
  if(btnMov){
    btnMov.addEventListener("click", function(){
      const ligado = btnMov.getAttribute("aria-pressed") === "true";
      btnMov.setAttribute("aria-pressed", ligado ? "false" : "true");
      document.body.classList.toggle("sem-movimento", ligado);
    });
  }

  function reduzMovimento(){
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch(e){ return false; } // API indisponível neste navegador: assume que animação é ok
  }
  const reduzido = reduzMovimento();

  /* ---- Ticker: duplicar faixa para loop perfeito ---- */
  const faixa = document.getElementById("faixa");
  if(faixa) faixa.innerHTML += faixa.innerHTML;

  /* ---- Contagem regressiva ---- */
  const alvo = new Date("2026-11-19T00:00:00-03:00").getTime();
  const el = {
    d: document.getElementById("cd-dias"),
    h: document.getElementById("cd-horas"),
    m: document.getElementById("cd-min"),
    s: document.getElementById("cd-seg")
  };
  function poe(campo, valor){
    if(campo.textContent !== valor){
      campo.textContent = valor;
      if(!reduzido){
        campo.classList.remove("pop");
        void campo.offsetWidth; /* reinicia a animação */
        campo.classList.add("pop");
      }
    }
  }
  function tick(){
    if(!el.d) return;
    const diff = alvo - Date.now();
    if(diff <= 0){
      poe(el.d,"00"); poe(el.h,"00"); poe(el.m,"00"); poe(el.s,"00");
      document.querySelector(".contagem__label").textContent = "GTA VI JÁ ESTÁ ENTRE NÓS";
      return;
    }
    poe(el.d, String(Math.floor(diff/86400000)));
    poe(el.h, String(Math.floor(diff%86400000/3600000)).padStart(2,"0"));
    poe(el.m, String(Math.floor(diff%3600000/60000)).padStart(2,"0"));
    poe(el.s, String(Math.floor(diff%60000/1000)).padStart(2,"0"));
  }
  if(el.d){ tick(); setInterval(tick, 1000); }

  /* ---- Estrelas e vagalumes gerados ---- */
  const _estrelas = document.getElementById("estrelas");
  if(!reduzido && _estrelas){
    const estrelas = _estrelas;
    for(let i=0;i<36;i++){
      const s = document.createElement("i");
      s.style.left = Math.random()*100 + "%";
      s.style.top = Math.random()*55 + "%";
      s.style.animationDelay = (Math.random()*4) + "s";
      s.style.animationDuration = (2.5 + Math.random()*4) + "s";
      s.style.opacity = .2 + Math.random()*.6;
      estrelas.appendChild(s);
    }
    const vaga = document.getElementById("vagalumes");
    for(let i=0;i<7;i++){
      const v = document.createElement("i");
      v.style.left = (5 + Math.random()*90) + "%";
      v.style.top = (35 + Math.random()*55) + "%";
      v.style.animationDelay = (Math.random()*14) + "s";
      v.style.animationDuration = (10 + Math.random()*10) + "s";
      vaga.appendChild(v);
    }
  }

  /* ---- Glitch periódico no título ---- */
  const glitch = document.getElementById("glitch");
  if(!reduzido && glitch){
    setInterval(function(){
      if(Math.random() < .55){
        glitch.classList.add("ativo");
        setTimeout(function(){ glitch.classList.remove("ativo"); }, 380);
      }
    }, 3200);
  }

  /* ---- Revelação no scroll ---- */
  const obs = new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add("visivel");
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.12});
  document.querySelectorAll(".observa").forEach(function(s){ obs.observe(s); });

  /* ---- Tilt 3D nos cards de notícia (desktop, mouse) ---- */
  const podeTilt = !reduzido && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if(podeTilt){
    document.querySelectorAll(".tilt").forEach(function(card){
      let raf = null;
      card.addEventListener("pointermove", function(ev){
        if(raf) return; /* no máximo 1 atualização por frame */
        raf = requestAnimationFrame(function(){
          const r = card.getBoundingClientRect();
          const x = (ev.clientX - r.left) / r.width - .5;
          const y = (ev.clientY - r.top) / r.height - .5;
          card.style.transform = "perspective(900px) rotateY(" + (x*6) + "deg) rotateX(" + (-y*6) + "deg) translateY(-3px)";
          raf = null;
        });
      });
      card.addEventListener("pointerleave", function(){
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        card.style.transform = "";
      });
    });
  }

  /* ---- Pausa as animações do hero quando ele sai da tela ---- */
  const hero = document.querySelector("header.hero");
  if(hero) new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      hero.classList.toggle("pausado", !e.isIntersecting);
    });
  }, {threshold:0}).observe(hero);

  /* ---- Contagem para o Extended Look (16h BRT de 27/08/2026) ---- */
  const netflix = new Date("2026-08-27T16:00:00-03:00").getTime();
  const youtube = new Date("2026-08-27T22:00:00-03:00").getTime();
  const elEvento = document.getElementById("cd-evento");
  const blocoEvento = document.getElementById("bloco-evento");
  const relogio = document.getElementById("relogio-evento");
  const barra = document.getElementById("barra-evento");

  function tickEvento(){
    if(!elEvento && !relogio) return;
    const agora = Date.now();
    let alvoEv = null, rotulo = "";
    if(agora < netflix){ alvoEv = netflix; rotulo = "Netflix"; }
    else if(agora < youtube){ alvoEv = youtube; rotulo = "YouTube"; }

    if(alvoEv === null){
      if(blocoEvento) blocoEvento.style.display = "none";
      if(relogio) relogio.textContent = "Já disponível na Netflix, no YouTube e no site oficial";
      return;
    }
    const dif = alvoEv - agora;
    const h = Math.floor(dif/3600000);
    const m = Math.floor(dif%3600000/60000);
    const s = Math.floor(dif%60000/1000);
    const txt = String(h).padStart(2,"0")+"h "+String(m).padStart(2,"0")+"m "+String(s).padStart(2,"0")+"s";
    if(elEvento){
      elEvento.textContent = txt;
      if(rotulo === "YouTube" && blocoEvento){
        blocoEvento.firstElementChild.textContent = "No ar na Netflix · no YouTube em";
      }
    }
    if(relogio){
      relogio.textContent = (rotulo === "Netflix")
        ? "Netflix em " + txt + " · YouTube às 22h"
        : "No ar na Netflix · grátis no YouTube em " + txt;
    }
  }
  tickEvento();
  setInterval(tickEvento, 1000);

  /* ---- Anúncios: a biblioteca já carrega pelo <head> (tag do Google).
     Aqui só ativamos, um a um, os blocos manuais que já têm um ID de anúncio
     real preenchido — os que ainda estão com data-ad-slot vazio continuam
     ocultos até você criar o bloco no AdSense e preencher idiomas/*.json. */
  (function(){
    const slots = document.querySelectorAll("[data-anuncio]");
    if(!slots.length) return;

    const prontos = Array.prototype.filter.call(slots, function(s){
      const ins = s.querySelector("ins.adsbygoogle");
      return ins && ins.dataset.adSlot && ins.dataset.adSlot.trim() !== "";
    });
    if(!prontos.length) return; // nenhum bloco com ID ainda: nada a fazer

    const obs = new IntersectionObserver(function(entradas){
      entradas.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.remove("anuncio--vazio");
        try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(err){}
        obs.unobserve(e.target);
      });
    }, {rootMargin: "600px"});
    prontos.forEach(function(s){ obs.observe(s); });
  })();

  /* ---- Mapa interativo de Leonida ---- */
  (function(){
    const svg = document.getElementById("mapa-svg");
    const palco = document.getElementById("mapa-palco");
    if(!svg || !palco) return;

    /* fichas vindas do HTML (traduzidas pelo gerador) */
    const dados = {};
    document.querySelectorAll("#mapa-dados > div").forEach(function(d){
      dados[d.dataset.r] = {
        nome: d.dataset.nome, real: d.dataset.real,
        tags: (d.dataset.tags || "").split("|").filter(Boolean),
        desc: d.textContent.trim()
      };
    });
    const painel = {
      cor:  document.getElementById("mapa-cor"),
      nome: document.getElementById("mapa-nome"),
      real: document.getElementById("mapa-real"),
      desc: document.getElementById("mapa-desc"),
      tags: document.getElementById("mapa-tags")
    };
    const alvos = svg.querySelectorAll(".regiao, .marco");

    function mostrar(el){
      const d = dados[el.dataset.r];
      if(!d || !painel.nome) return;
      alvos.forEach(function(a){ a.classList.toggle("ativa", a === el); });
      painel.cor.style.background = el.dataset.cor || "var(--agua)";
      painel.nome.textContent = d.nome;
      painel.real.textContent = d.real;
      painel.desc.textContent = d.desc;
      painel.tags.innerHTML = "";
      d.tags.forEach(function(t){
        const s = document.createElement("span");
        s.textContent = t;
        painel.tags.appendChild(s);
      });
    }

    /* ---- zoom e arrasto pelo viewBox ---- */
    const BASE = {x:0, y:0, w:620, h:900};
    let vista = Object.assign({}, BASE);
    const MIN_W = 155, MAX_W = 620;

    function aplicar(){
      svg.setAttribute("viewBox", vista.x.toFixed(1)+" "+vista.y.toFixed(1)+" "+
                                  vista.w.toFixed(1)+" "+vista.h.toFixed(1));
    }
    function limitar(){
      vista.w = Math.min(MAX_W, Math.max(MIN_W, vista.w));
      vista.h = vista.w * (BASE.h / BASE.w);
      vista.x = Math.min(BASE.w - vista.w, Math.max(0, vista.x));
      vista.y = Math.min(BASE.h - vista.h, Math.max(0, vista.y));
    }
    function zoom(fator, fx, fy){
      const px = vista.x + vista.w * fx;
      const py = vista.y + vista.h * fy;
      vista.w = vista.w * fator;
      vista.h = vista.w * (BASE.h / BASE.w);
      vista.x = px - vista.w * fx;
      vista.y = py - vista.h * fy;
      limitar(); aplicar();
    }

    svg.addEventListener("wheel", function(ev){
      ev.preventDefault();
      const r = svg.getBoundingClientRect();
      zoom(ev.deltaY > 0 ? 1.18 : 0.85,
           (ev.clientX - r.left) / r.width,
           (ev.clientY - r.top) / r.height);
    }, {passive:false});

    palco.querySelectorAll("[data-zoom]").forEach(function(b){
      b.addEventListener("click", function(){
        const acao = b.dataset.zoom;
        if(acao === "reset"){ vista = Object.assign({}, BASE); aplicar(); }
        else zoom(acao === "mais" ? 0.75 : 1.33, .5, .5);
      });
    });

    let arrastando = false, ini = null, moveu = 0;
    svg.addEventListener("pointerdown", function(ev){
      arrastando = true; moveu = 0;
      ini = {cx: ev.clientX, cy: ev.clientY, vx: vista.x, vy: vista.y};
      palco.classList.add("arrastando");
      svg.setPointerCapture(ev.pointerId);
    });
    svg.addEventListener("pointermove", function(ev){
      if(!arrastando) return;
      const r = svg.getBoundingClientRect();
      const dx = ev.clientX - ini.cx, dy = ev.clientY - ini.cy;
      moveu = Math.max(moveu, Math.abs(dx) + Math.abs(dy));
      vista.x = ini.vx - dx * (vista.w / r.width);
      vista.y = ini.vy - dy * (vista.h / r.height);
      limitar(); aplicar();
    });
    function soltar(ev){
      if(!arrastando) return;
      arrastando = false;
      palco.classList.remove("arrastando");
      try{ svg.releasePointerCapture(ev.pointerId); }catch(e){}
    }
    svg.addEventListener("pointerup", soltar);
    svg.addEventListener("pointercancel", soltar);

    /* ---- seleção (ignora clique que na verdade foi arrasto) ---- */
    alvos.forEach(function(el){
      el.addEventListener("click", function(){ if(moveu < 6) mostrar(el); });
      el.addEventListener("mouseenter", function(){ if(!arrastando) mostrar(el); });
      el.addEventListener("focus", function(){ mostrar(el); });
      el.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); mostrar(el); }
      });
    });

    /* ---- camadas ligáveis ---- */
    palco.querySelectorAll("[data-camada]").forEach(function(b){
      b.addEventListener("click", function(){
        const ligada = b.getAttribute("aria-pressed") === "true";
        b.setAttribute("aria-pressed", ligada ? "false" : "true");
        const c = svg.querySelector("." + b.dataset.camada);
        if(c) c.style.display = ligada ? "none" : "";
      });
    });
  })();

  /* ---- Plantão: feed automático (feed.json publicado pelo pipeline) ---- */
  fetch("{{__base__}}feed.json", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(posts){
      if(!Array.isArray(posts) || !posts.length) return;
      const alvoFeed = document.getElementById("feed-auto");
      alvoFeed.innerHTML = "";
      posts.slice(0, 8).forEach(function(p){
        const art = document.createElement("article");
        art.className = "post-auto";
        const t = document.createElement("time");
        t.textContent = p.data || "";
        const h = document.createElement("h4");
        h.textContent = p.titulo || "";
        const tx = document.createElement("div");
        tx.className = "post-auto__conteudo";
        if(p.html){
          // HTML já sanitizado na origem (automacao/posts.py)
          tx.innerHTML = p.html;
        } else {
          const par = document.createElement("p");
          par.textContent = p.texto || "";
          tx.appendChild(par);
        }
        art.appendChild(t); art.appendChild(h); art.appendChild(tx);
        if(p.imagem){
          const img = document.createElement("img");
          img.className = "post-auto__img";
          img.src = p.imagem;
          img.alt = p.titulo || "";
          img.loading = "lazy";
          img.decoding = "async";
          // se a imagem sumir do servidor, o card continua legível
          img.onerror = function(){ img.remove(); };
          art.appendChild(img);
        }
        // botão só para links do X; qualquer outro destino é ignorado
        if(p.link && /^https?:\/\/(x\.com|twitter\.com)\//i.test(p.link)){
          const a = document.createElement("a");
          a.href = p.link; a.target = "_blank"; a.rel = "noopener";
          a.textContent = "{{fd01}}";
          a.style.cssText = "font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em";
          art.appendChild(a);
        }
        alvoFeed.appendChild(art);
      });
    })
    .catch(function(){ /* sem feed.json ainda — mantém o aviso padrão */ });
})();
</script>
