<script>
(function(){
  /* ---- Sugestão de idioma (detecção do navegador, não força nada) ---- */
  (function(){
    var CHAVE = "viceversa_idioma_escolha"; // "aceito" | "recusado" | ausente

    var jaEscolheu = false;
    try { jaEscolheu = !!localStorage.getItem(CHAVE); } catch (e) {}
    if (jaEscolheu) return;

    var atualLink = document.querySelector('.seletor-idioma a.idioma-atual');
    if (!atualLink) return;
    var idiomaAtual = (atualLink.getAttribute('hreflang') || '').toLowerCase();

    // idiomas do navegador, na ordem de preferência da pessoa
    var prefs = (navigator.languages && navigator.languages.length)
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || ''];

    function normalizar(tag) { return (tag || '').toLowerCase(); }
    function raiz(tag) { return normalizar(tag).split('-')[0]; }

    // entre os links do seletor, acha o primeiro cujo idioma bate com a preferência do navegador
    var opcoes = Array.prototype.slice.call(document.querySelectorAll('.seletor-idioma a'));
    var sugestao = null;
    for (var i = 0; i < prefs.length && !sugestao; i++) {
      var p = normalizar(prefs[i]);
      for (var j = 0; j < opcoes.length; j++) {
        var hl = normalizar(opcoes[j].getAttribute('hreflang'));
        if (hl === p || raiz(hl) === raiz(p)) { sugestao = opcoes[j]; break; }
      }
    }

    // nada a sugerir se o navegador já fala o idioma da página atual
    if (!sugestao || raiz(sugestao.getAttribute('hreflang')) === raiz(idiomaAtual)) return;

    // Mensagens fixas, escritas no idioma SUGERIDO (não no idioma da página
    // atual) — é o idioma que a pessoa efetivamente consegue ler. Por isso
    // isso vive aqui em JS puro, e não em idiomas/*.json: teria que existir
    // nas 3 traduções ao mesmo tempo, para qualquer página de origem.
    var MSGS = {
      "en":    { texto: "This site is also available in English.",        ir: "View in English",     nao: "No, thanks" },
      "pt-br": { texto: "Este site também está disponível em português.", ir: "Ver em português",    nao: "Não, obrigado" },
      "es":    { texto: "Este sitio también está disponible en español.", ir: "Ver en español",      nao: "No, gracias" }
    };
    var alvo = raiz(sugestao.getAttribute("hreflang"));
    var msg = MSGS[sugestao.getAttribute("hreflang").toLowerCase()] || MSGS[alvo] || MSGS["en"];

    var barra = document.getElementById("barra-idioma");
    var txt = document.getElementById("barra-idioma-txt");
    var ir = document.getElementById("barra-idioma-ir");
    var nao = document.getElementById("barra-idioma-nao");
    if (!barra || !txt || !ir || !nao) return;

    txt.textContent = msg.texto;
    ir.textContent = msg.ir;
    ir.href = sugestao.getAttribute("href");
    nao.textContent = msg.nao;
    barra.classList.add("mostrar");

    ir.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "aceito"); } catch (e) {}
    });
    nao.addEventListener("click", function(){
      try { localStorage.setItem(CHAVE, "recusado"); } catch (e) {}
      barra.classList.remove("mostrar");
    });
  })();

  /* ---- Menu overlay ---- */
  const painel = document.getElementById("menu-painel");
  const fundo  = document.getElementById("menu-fundo");
  const abrir  = document.getElementById("abrir-menu");
  const fechar = document.getElementById("fechar-menu");
  if(painel && abrir){
    let focoAnterior = null;
    function abrirMenu(){
      focoAnterior = document.activeElement;
      document.body.classList.add("menu-aberto");
      document.body.style.overflow = "hidden";
      fundo.hidden = false;
      painel.setAttribute("aria-hidden","false");
      abrir.setAttribute("aria-expanded","true");
      const p = painel.querySelector(".menu-links a");
      if(p) p.focus();
    }
    function fecharMenu(){
      document.body.classList.remove("menu-aberto");
      document.body.style.overflow = "";
      painel.setAttribute("aria-hidden","true");
      abrir.setAttribute("aria-expanded","false");
      setTimeout(function(){ fundo.hidden = true; }, 360);
      if(focoAnterior) focoAnterior.focus();
    }
    abrir.addEventListener("click", abrirMenu);
    if(fechar) fechar.addEventListener("click", fecharMenu);
    fundo.addEventListener("click", fecharMenu);
    document.addEventListener("keydown", function(ev){
      if(ev.key === "Escape" && document.body.classList.contains("menu-aberto")) fecharMenu();
    });
    /* prende o foco dentro do painel enquanto ele estiver aberto */
    painel.addEventListener("keydown", function(ev){
      if(ev.key !== "Tab") return;
      const f = painel.querySelectorAll("a[href], button");
      if(!f.length) return;
      const primeiro = f[0], ultimo = f[f.length-1];
      if(ev.shiftKey && document.activeElement === primeiro){ ev.preventDefault(); ultimo.focus(); }
      else if(!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primeiro.focus(); }
    });
  }

  /* ---- Alternador de movimento ---- */
  const btnMov = document.getElementById("btn-movimento");
  if(btnMov){
    btnMov.addEventListener("click", function(){
      const ligado = btnMov.getAttribute("aria-pressed") === "true";
      btnMov.setAttribute("aria-pressed", ligado ? "false" : "true");
      document.body.classList.toggle("sem-movimento", ligado);
    });
  }

  function reduzMovimento(){
    try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch(e){ return false; } // API indisponível neste navegador: assume que animação é ok
  }
  const reduzido = reduzMovimento();

  /* ---- Ticker: duplicar faixa para loop perfeito ---- */
  const faixa = document.getElementById("faixa");
  if(faixa) faixa.innerHTML += faixa.innerHTML;

  /* ---- Contagem regressiva ---- */
  const alvo = new Date("2026-11-19T00:00:00-03:00").getTime();
  const el = {
    d: document.getElementById("cd-dias"),
    h: document.getElementById("cd-horas"),
    m: document.getElementById("cd-min"),
    s: document.getElementById("cd-seg")
  };
  function poe(campo, valor){
    if(campo.textContent !== valor){
      campo.textContent = valor;
      if(!reduzido){
        campo.classList.remove("pop");
        void campo.offsetWidth; /* reinicia a animação */
        campo.classList.add("pop");
      }
    }
  }
  function tick(){
    if(!el.d) return;
    const diff = alvo - Date.now();
    if(diff <= 0){
      poe(el.d,"00"); poe(el.h,"00"); poe(el.m,"00"); poe(el.s,"00");
      document.querySelector(".contagem__label").textContent = "{{cd01}}";
      return;
    }
    poe(el.d, String(Math.floor(diff/86400000)));
    poe(el.h, String(Math.floor(diff%86400000/3600000)).padStart(2,"0"));
    poe(el.m, String(Math.floor(diff%3600000/60000)).padStart(2,"0"));
    poe(el.s, String(Math.floor(diff%60000/1000)).padStart(2,"0"));
  }
  if(el.d){ tick(); setInterval(tick, 1000); }

  /* ---- Estrelas e vagalumes gerados ---- */
  const _estrelas = document.getElementById("estrelas");
  if(!reduzido && _estrelas){
    const estrelas = _estrelas;
    for(let i=0;i<36;i++){
      const s = document.createElement("i");
      s.style.left = Math.random()*100 + "%";
      s.style.top = Math.random()*55 + "%";
      s.style.animationDelay = (Math.random()*4) + "s";
      s.style.animationDuration = (2.5 + Math.random()*4) + "s";
      s.style.opacity = .2 + Math.random()*.6;
      estrelas.appendChild(s);
    }
    const vaga = document.getElementById("vagalumes");
    for(let i=0;i<7;i++){
      const v = document.createElement("i");
      v.style.left = (5 + Math.random()*90) + "%";
      v.style.top = (35 + Math.random()*55) + "%";
      v.style.animationDelay = (Math.random()*14) + "s";
      v.style.animationDuration = (10 + Math.random()*10) + "s";
      vaga.appendChild(v);
    }
  }

  /* ---- Glitch periódico no título ---- */
  const glitch = document.getElementById("glitch");
  if(!reduzido && glitch){
    setInterval(function(){
      if(Math.random() < .55){
        glitch.classList.add("ativo");
        setTimeout(function(){ glitch.classList.remove("ativo"); }, 380);
      }
    }, 3200);
  }

  /* ---- Revelação no scroll ---- */
  const obs = new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add("visivel");
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.12});
  document.querySelectorAll(".observa").forEach(function(s){ obs.observe(s); });

  /* ---- Tilt 3D nos cards de notícia (desktop, mouse) ---- */
  const podeTilt = !reduzido && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  if(podeTilt){
    document.querySelectorAll(".tilt").forEach(function(card){
      let raf = null;
      card.addEventListener("pointermove", function(ev){
        if(raf) return; /* no máximo 1 atualização por frame */
        raf = requestAnimationFrame(function(){
          const r = card.getBoundingClientRect();
          const x = (ev.clientX - r.left) / r.width - .5;
          const y = (ev.clientY - r.top) / r.height - .5;
          card.style.transform = "perspective(900px) rotateY(" + (x*6) + "deg) rotateX(" + (-y*6) + "deg) translateY(-3px)";
          raf = null;
        });
      });
      card.addEventListener("pointerleave", function(){
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        card.style.transform = "";
      });
    });
  }

  /* ---- Pausa as animações do hero quando ele sai da tela ---- */
  const hero = document.querySelector("header.hero");
  if(hero) new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      hero.classList.toggle("pausado", !e.isIntersecting);
    });
  }, {threshold:0}).observe(hero);


  /* ---- Anúncios: a biblioteca já carrega pelo <head> (tag do Google).
     Aqui só ativamos, um a um, os blocos manuais que já têm um ID de anúncio
     real preenchido — os que ainda estão com data-ad-slot vazio continuam
     ocultos até você criar o bloco no AdSense e preencher idiomas/*.json. */
  (function(){
    const slots = document.querySelectorAll("[data-anuncio]");
    if(!slots.length) return;

    const prontos = Array.prototype.filter.call(slots, function(s){
      const ins = s.querySelector("ins.adsbygoogle");
      return ins && ins.dataset.adSlot && ins.dataset.adSlot.trim() !== "";
    });
    if(!prontos.length) return; // nenhum bloco com ID ainda: nada a fazer

    const obs = new IntersectionObserver(function(entradas){
      entradas.forEach(function(e){
        if(!e.isIntersecting) return;
        e.target.classList.remove("anuncio--vazio");
        try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(err){}
        obs.unobserve(e.target);
      });
    }, {rootMargin: "600px"});
    prontos.forEach(function(s){ obs.observe(s); });
  })();

  /* ---- Mapa de Leonida (recriado em vetor pelo VICEVERSA, Leaflet) ----
     Base: "YANIS GTA VI Community Map" (Mapping Community), recriado no estilo
     do site com autorização do autor — ver mapa/recriar_mapa.py. O SVG não traz
     cores: a paleta (Noite/Dia) vem do CSS. Pontos e rótulos: mapa/pontos.json. */
  (function(){
    const alvo = document.getElementById("atlas-mapa");
    const cfgEl = document.getElementById("atlas-config");
    const caixa = document.getElementById("atlas");
    if(!alvo || !cfgEl || !caixa || typeof L === "undefined") return;

    let cfg;
    try { cfg = JSON.parse(cfgEl.textContent); } catch(e){ return; }
    if(!cfg || !cfg.info) return;
    const info = cfg.info, pontos = cfg.pontos || [], txt = cfg.textos || {};
    const W = info.largura, H = info.altura;
    const CORES = {regiao:"#FF3D8A", marco:"#2FE6C8", trailer:"#FF8A3D", real:"#FFD98A"};

    /* fichas já traduzidas pelo gerador (textos m10…m67) */
    const fichas = {};
    document.querySelectorAll("#mapa-dados [data-r]").forEach(function(el){
      fichas[el.dataset.r] = {
        nome: el.dataset.nome, real: el.dataset.real,
        tags: (el.dataset.tags || "").split("|").filter(Boolean),
        desc: el.textContent.trim()
      };
    });
    pontos.forEach(function(p){
      const f = p.ficha && fichas[p.ficha];
      if(f){
        p.nome = p.nome || f.nome; p.real = p.real || f.real;
        p.desc = p.desc || f.desc; p.tags = p.tags || f.tags;
      }
      p.tags = p.tags || [];
    });

    /* ── mapa em pixels (CRS.Simple): 1 unidade = 1 px do mapa no zoom Z ── */
    const Z = Math.max(0, Math.ceil(Math.log2(Math.max(W, H) / 256)));
    const mapa = L.map(alvo, {
      crs: L.CRS.Simple, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 90,
      attributionControl: true, zoomControl: true, maxBoundsViscosity: 0.8
    });
    function paraLatLng(fx, fy){ return mapa.unproject([fx * W, fy * H], Z); }
    function paraFracao(latlng){ const p = mapa.project(latlng, Z); return [p.x / W, p.y / H]; }
    const limites = L.latLngBounds(paraLatLng(0, 1), paraLatLng(1, 0));
    mapa.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
    mapa.attributionControl.addAttribution(cfg.atribuicao);
    mapa.setMaxBounds(limites.pad(0.2));
    function enquadrar(){ mapa.fitBounds(limites, {padding:[8, 8]}); }
    enquadrar();
    mapa.setMinZoom(mapa.getZoom() - 0.5);
    mapa.setMaxZoom(Z + 3);

    /* espessura das linhas e tamanho dos rótulos acompanham o zoom */
    function porZoom(){
      const rel = mapa.getZoom() - mapa.getMinZoom();
      caixa.style.setProperty("--traco", (0.7 + rel * 0.35).toFixed(2));
      caixa.dataset.zoom = rel < 1.2 ? "longe" : rel < 2.6 ? "medio" : "perto";
    }
    mapa.on("zoomend", porZoom); porZoom();

    /* ── base: o vetor recriado, no estilo Noite ou Dia ── */
    let vetor = null;
    fetch(cfg.svg).then(function(r){ return r.text(); }).then(function(t){
      const tmp = document.createElement("div");
      tmp.innerHTML = t;
      const el = tmp.querySelector("svg");
      if(!el) return;
      el.setAttribute("preserveAspectRatio", "none");
      vetor = L.svgOverlay(el, limites, {interactive: false, className: "atlas-vetor"}).addTo(mapa);
      vetor.bringToBack();
      aplicarEstilo(estiloAtual);
    });

    let estiloAtual = "noite";
    function aplicarEstilo(estilo){
      estiloAtual = estilo;
      caixa.classList.remove("atlas--noite", "atlas--dia");
      caixa.classList.add("atlas--" + estilo);
      document.querySelectorAll("#atlas-estilos [data-estilo]").forEach(function(b){
        b.setAttribute("aria-pressed", b.dataset.estilo === estilo ? "true" : "false");
      });
      try { localStorage.setItem("viceversa_mapa_estilo", estilo); } catch(e){}
    }
    try {
      const salvo = localStorage.getItem("viceversa_mapa_estilo");
      if(salvo === "dia" || salvo === "noite") estiloAtual = salvo;
    } catch(e){}
    aplicarEstilo(estiloAtual);
    document.querySelectorAll("#atlas-estilos [data-estilo]").forEach(function(b){
      b.addEventListener("click", function(){ aplicarEstilo(b.dataset.estilo); });
    });

    /* ── grade de referência (A1…H12) ── */
    const botaoGrade = document.querySelector("#atlas-camadas [data-grade]");
    const cel = info.grade ? info.grade.celula : 0;
    function quadrante(p){
      if(!cel) return "";
      const col = Math.min(info.grade.colunas - 1, Math.floor(p.x * W / cel));
      const lin = Math.min(info.grade.linhas - 1, Math.floor(p.y * H / cel));
      return String.fromCharCode(65 + col) + (lin + 1);
    }
    if(botaoGrade){
      if(!cel) botaoGrade.hidden = true;
      botaoGrade.addEventListener("click", function(){
        const ligada = botaoGrade.getAttribute("aria-pressed") === "true";
        botaoGrade.setAttribute("aria-pressed", ligada ? "false" : "true");
        caixa.classList.toggle("atlas--grade", !ligada);
      });
    }

    /* ── marcadores: regiões viram nomes grandes; o resto, pinos ── */
    const camadas = {};
    const marcadores = {};
    function escapar(s){ const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
    pontos.forEach(function(p){
      const cat = p.cat || "marco";
      if(!camadas[cat]) camadas[cat] = L.layerGroup().addTo(mapa);
      let icone;
      if(cat === "regiao"){
        icone = L.divIcon({
          className: "atlas-regiao",
          html: '<b>' + escapar(p.nome) + '</b><small>' + escapar(p.real) + '</small>',
          iconSize: null
        });
      } else {
        icone = L.divIcon({
          className: "atlas-pino atlas-pino--" + cat,
          html: '<span style="--cor:' + (CORES[cat] || CORES.marco) + '"></span>',
          iconSize: [22, 22], iconAnchor: [11, 11]
        });
      }
      const m = L.marker(paraLatLng(p.x, p.y), {icon: icone, title: p.nome, keyboard: true, riseOnHover: true});
      m.on("click", function(){ selecionar(p, true); });
      if(cat !== "regiao") m.bindTooltip(p.nome, {direction: "top", offset: [0, -10], className: "atlas-dica"});
      m.addTo(camadas[cat]);
      marcadores[p.id] = m;
    });
    /* rótulos soltos (água etc.): só texto, sem clique */
    const rotulos = L.layerGroup().addTo(mapa);
    (cfg.rotulos || []).forEach(function(r){
      L.marker(paraLatLng(r.x, r.y), {
        interactive: false, keyboard: false,
        icon: L.divIcon({className: "atlas-rotulo atlas-rotulo--" + r.tipo, html: escapar(r.nome), iconSize: null})
      }).addTo(rotulos);
    });

    document.querySelectorAll("#atlas-camadas [data-cat]").forEach(function(b){
      const cat = b.dataset.cat;
      if(!camadas[cat]){ b.hidden = true; return; }
      b.addEventListener("click", function(){
        const ligada = b.getAttribute("aria-pressed") === "true";
        b.setAttribute("aria-pressed", ligada ? "false" : "true");
        if(ligada) mapa.removeLayer(camadas[cat]); else mapa.addLayer(camadas[cat]);
        if(cat === "regiao"){ if(ligada) mapa.removeLayer(rotulos); else mapa.addLayer(rotulos); }
        filtrarLista();
      });
    });

    /* ── painel lateral ── */
    const el = {
      cor: document.getElementById("mapa-cor"), nome: document.getElementById("mapa-nome"),
      real: document.getElementById("mapa-real"), desc: document.getElementById("mapa-desc"),
      tags: document.getElementById("mapa-tags"), acoes: document.getElementById("atlas-acoes")
    };
    function selecionar(p, voar){
      el.cor.style.background = CORES[p.cat] || CORES.marco;
      el.nome.textContent = p.nome || "";
      const q = quadrante(p);
      el.real.textContent = (p.real || "") + (q ? "  ·  " + txt.quadrante + " " + q : "");
      el.desc.textContent = p.desc || "";
      el.tags.innerHTML = "";
      p.tags.forEach(function(t){ const s = document.createElement("span"); s.textContent = t; el.tags.appendChild(s); });
      el.acoes.innerHTML = "";
      if(p.video){
        const a = document.createElement("a");
        a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(p.video) + (p.t ? "&t=" + parseInt(p.t, 10) + "s" : "");
        a.target = "_blank"; a.rel = "noopener"; a.textContent = txt.video;
        el.acoes.appendChild(a);
      }
      const copiar = document.createElement("button");
      copiar.type = "button"; copiar.textContent = txt.copiar;
      copiar.addEventListener("click", function(){
        const link = location.href.split("#")[0] + "#" + p.id;
        if(navigator.clipboard) navigator.clipboard.writeText(link).then(function(){
          copiar.textContent = txt.copiado;
          setTimeout(function(){ copiar.textContent = txt.copiar; }, 2000);
        }).catch(function(){});
      });
      el.acoes.appendChild(copiar);
      document.querySelectorAll(".atlas .ativo").forEach(function(n){ n.classList.remove("ativo"); });
      const m = marcadores[p.id];
      if(m && m._icon) m._icon.classList.add("ativo");
      document.querySelectorAll("#atlas-lista li").forEach(function(li){
        li.classList.toggle("ativo", li.dataset.id === p.id);
      });
      if(voar) mapa.flyTo(paraLatLng(p.x, p.y), Math.max(mapa.getZoom(), mapa.getMinZoom() + 2), {duration: .6});
      if(history.replaceState) history.replaceState(null, "", "#" + p.id);
    }

    /* ── lista + busca ── */
    const lista = document.getElementById("atlas-lista");
    const busca = document.getElementById("atlas-busca");
    function normalizar(s){ return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
    pontos.slice().sort(function(a, b){ return (a.nome || "").localeCompare(b.nome || ""); }).forEach(function(p){
      const li = document.createElement("li");
      li.dataset.id = p.id; li.dataset.cat = p.cat;
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<i class="ponto-cor ponto-cor--' + p.cat + '"></i>';
      const nome = document.createElement("span"); nome.textContent = p.nome || p.id;
      const real = document.createElement("small"); real.textContent = [p.real, quadrante(p)].filter(Boolean).join(" · ");
      b.appendChild(nome); b.appendChild(real);
      b.addEventListener("click", function(){ selecionar(p, true); });
      li.appendChild(b);
      li._busca = normalizar([p.nome, p.real, p.desc, p.tags.join(" "), quadrante(p)].join(" "));
      lista.appendChild(li);
    });
    const vazio = document.createElement("li");
    vazio.className = "atlas__vazio"; vazio.textContent = txt.nada; vazio.hidden = true;
    lista.appendChild(vazio);
    function filtrarLista(){
      const q = normalizar(busca.value.trim());
      let visiveis = 0;
      lista.querySelectorAll("li[data-id]").forEach(function(li){
        const ligada = camadas[li.dataset.cat] && mapa.hasLayer(camadas[li.dataset.cat]);
        const ok = ligada && (!q || li._busca.indexOf(q) !== -1);
        li.hidden = !ok; if(ok) visiveis++;
      });
      vazio.hidden = visiveis > 0;
    }
    busca.addEventListener("input", filtrarLista);
    busca.addEventListener("keydown", function(e){
      if(e.key !== "Enter") return;
      const primeiro = lista.querySelector("li[data-id]:not([hidden]) button");
      if(primeiro){ e.preventDefault(); primeiro.click(); }
    });

    /* ── tela cheia e enquadrar ── */
    document.getElementById("atlas-enquadrar").addEventListener("click", enquadrar);
    document.getElementById("atlas-tela").addEventListener("click", function(){
      const cheia = caixa.classList.toggle("atlas--cheia");
      document.body.classList.toggle("atlas-aberto", cheia);
      if(cheia && caixa.requestFullscreen) caixa.requestFullscreen().catch(function(){});
      if(!cheia && document.fullscreenElement) document.exitFullscreen().catch(function(){});
      setTimeout(function(){ mapa.invalidateSize(); }, 200);
    });
    document.addEventListener("fullscreenchange", function(){
      if(!document.fullscreenElement && caixa.classList.contains("atlas--cheia")){
        caixa.classList.remove("atlas--cheia");
        document.body.classList.remove("atlas-aberto");
        setTimeout(function(){ mapa.invalidateSize(); }, 200);
      }
    });

    /* ── link direto: /map/#vice-city abre já no local ── */
    function abrirDoEndereco(){
      const id = decodeURIComponent(location.hash.replace("#", ""));
      const p = pontos.find(function(q){ return q.id === id; });
      if(p) selecionar(p, true);
    }
    abrirDoEndereco();
    window.addEventListener("hashchange", abrirDoEndereco);

    /* ── modo de edição: /map/?editar=1 mostra a posição de cada clique ── */
    if(/[?&]editar=1/.test(location.search)){
      const coord = document.getElementById("atlas-coord");
      coord.hidden = false; coord.textContent = txt.editar;
      mapa.on("click", function(e){
        const f = paraFracao(e.latlng);
        const linha = '"x": ' + f[0].toFixed(4) + ', "y": ' + f[1].toFixed(4);
        coord.textContent = linha;
        L.popup().setLatLng(e.latlng).setContent("<code>" + linha + "</code>").openOn(mapa);
        if(navigator.clipboard) navigator.clipboard.writeText(linha).catch(function(){});
      });
    }
  })();

  /* ---- Plantão: os cards são gerados pelo montar.py (HTML estático, indexável).
     Aqui só removemos imagens que não carregarem, para não deixar ícone quebrado. ---- */
  document.querySelectorAll(".post-auto img, .artigo__corpo img, .noticia__img").forEach(function(im){
    im.addEventListener("error", function(){
      const pai = im.parentElement;
      im.remove();
      if(pai && pai.tagName === "A" && !pai.textContent.trim()) pai.remove();
    });
  });

  /* ---- Compartilhar: menu nativo no celular, copiar link no desktop ---- */
  document.querySelectorAll("[data-compartilhar]").forEach(function(b){
    if(!navigator.share){ b.style.display = "none"; return; }
    b.addEventListener("click", function(){
      navigator.share({title: document.title, url: b.dataset.compartilhar}).catch(function(){});
    });
  });
  document.querySelectorAll("[data-copiar]").forEach(function(b){
    b.addEventListener("click", function(){
      const original = b.textContent;
      const pronto = function(){
        b.textContent = b.dataset.ok || original;
        setTimeout(function(){ b.textContent = original; }, 2000);
      };
      if(navigator.clipboard){
        navigator.clipboard.writeText(b.dataset.copiar).then(pronto).catch(function(){});
      }
    });
  });
})();
</script>
</body>
</html>
