<style>
  :root{
    --noite:#120720;
    --noite-2:#1D0D33;
    --magenta:#FF3D8A;
    --laranja:#FF8A3D;
    --agua:#2FE6C8;
    --roxo:#7B3DFF;
    --creme:#FFF3E4;
    --creme-40:rgba(255,243,228,.4);
    --creme-70:rgba(255,243,228,.72);
    --linha:rgba(255,61,138,.25);
    --card:rgba(255,243,228,.045);
    --font-display:"Bebas Neue", sans-serif;
    --font-body:"Sora", sans-serif;
    --font-mono:"IBM Plex Mono", monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--noite);
    color:var(--creme);
    font-family:var(--font-body);
    font-weight:300;
    line-height:1.65;
    overflow-x:hidden;
  }
  a{color:var(--agua);text-decoration:none}
  a:focus-visible,summary:focus-visible{outline:2px solid var(--agua);outline-offset:3px;border-radius:4px}
  ::selection{background:var(--magenta);color:var(--noite)}
  ::-webkit-scrollbar{width:11px}
  ::-webkit-scrollbar-track{background:var(--noite)}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--magenta),var(--laranja));border-radius:6px;border:2px solid var(--noite)}

  /* ---- SUGESTÃO DE IDIOMA (banner de detecção do navegador) ---- */
  .barra-idioma{
    display:none;align-items:center;justify-content:center;gap:.9rem;flex-wrap:wrap;
    background:linear-gradient(90deg,rgba(47,230,200,.16),rgba(255,61,138,.14),rgba(47,230,200,.16));
    border-bottom:1px solid var(--agua);
    padding:.65rem 1.2rem;text-align:center;
    font-family:var(--font-mono);font-size:.76rem;
  }
  .barra-idioma.mostrar{display:flex}
  .barra-idioma__txt{color:var(--creme)}
  .barra-idioma__acoes{display:flex;gap:.5rem}
  .barra-idioma a, .barra-idioma button{
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;
    border-radius:999px;padding:.32rem .85rem;cursor:pointer;border:1px solid transparent;
    transition:transform .2s;
  }
  .barra-idioma a{background:var(--agua);color:var(--noite);font-weight:500}
  .barra-idioma button{background:transparent;border-color:var(--linha);color:var(--creme-70)}
  .barra-idioma a:hover, .barra-idioma button:hover{transform:translateY(-1px)}

  /* ---- MENU OVERLAY (estilo do site oficial) ---- */
  .btn-menu{
    display:flex;align-items:center;gap:.55rem;background:none;border:0;cursor:pointer;
    color:var(--creme);font-family:var(--font-mono);font-size:.72rem;letter-spacing:.18em;
    text-transform:uppercase;padding:.4rem .2rem;
  }
  .btn-menu .barras{display:flex;flex-direction:column;gap:4px;width:20px}
  .btn-menu .barras i{display:block;height:2px;background:var(--creme);transition:transform .3s, opacity .3s}
  .btn-menu:hover .barras i{background:var(--agua)}
  .btn-menu:hover{color:var(--agua)}

  .menu-fundo{
    position:fixed;inset:0;z-index:90;background:rgba(6,3,12,.72);
    opacity:0;visibility:hidden;transition:opacity .35s ease, visibility .35s;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .menu-aberto .menu-fundo{opacity:1;visibility:visible}

  .menu-painel{
    position:fixed;top:0;right:0;bottom:0;z-index:91;
    width:min(480px,100%);
    background:linear-gradient(160deg,#1B0D2E 0%, #150A26 55%, #24102F 100%);
    border-left:1px solid var(--linha);
    transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;
    padding:1.4rem clamp(1.6rem,4vw,3rem) 1.6rem;
    overflow-y:auto;
  }
  .menu-aberto .menu-painel{transform:translateX(0)}

  .menu-topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2.4rem}
  .menu-marca{display:flex;align-items:center;gap:.8rem;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.16em;color:var(--creme-70)}
  .menu-marca .risco{width:1px;height:18px;background:var(--linha)}
  .btn-fechar{
    width:42px;height:42px;border-radius:50%;cursor:pointer;
    background:rgba(255,243,228,.08);border:1px solid var(--linha);color:var(--creme);
    font-size:1.1rem;line-height:1;display:grid;place-items:center;
    transition:background .25s, border-color .25s, transform .25s;
  }
  .btn-fechar:hover{background:rgba(255,61,138,.2);border-color:var(--magenta);transform:rotate(90deg)}

  .menu-links{display:flex;flex-direction:column;gap:.1rem;flex:1}
  .menu-links a{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    font-family:var(--font-display);font-weight:400;
    font-size:clamp(2rem,5.5vw,2.9rem);line-height:1.06;letter-spacing:.03em;
    color:var(--creme);padding:.42rem 0;
    border-bottom:1px solid rgba(255,243,228,.07);
    transition:color .25s, padding-left .3s;
  }
  .menu-links a::after{content:"›";font-size:.8em;color:var(--creme-40);transition:color .25s, transform .3s}
  .menu-links a:hover,.menu-links a:focus-visible{color:var(--magenta);padding-left:.5rem}
  .menu-links a:hover::after{color:var(--magenta);transform:translateX(4px)}
  .menu-links a[aria-current="page"]{color:var(--agua)}
  .menu-links a[aria-current="page"]::after{content:"●";font-size:.34em;color:var(--agua)}

  .menu-rodape{margin-top:2rem;display:flex;flex-direction:column;gap:1.1rem}
  .menu-social{display:flex;gap:.7rem}
  .menu-social a{
    width:38px;height:38px;border:1px solid var(--linha);border-radius:50%;
    display:grid;place-items:center;color:var(--creme-70);
    transition:color .25s, border-color .25s;
  }
  .menu-social svg{width:16px;height:16px;fill:currentColor}
  .menu-social a:hover{color:var(--agua);border-color:var(--agua)}
  .menu-linha{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    padding-top:1.1rem;border-top:1px solid var(--linha);
  }
  .menu-idiomas{display:flex;align-items:center;gap:.5rem;font-family:var(--font-mono);font-size:.7rem}
  .menu-idiomas .globo{width:15px;height:15px;fill:var(--creme-40)}
  .menu-idiomas a{color:var(--creme-40);padding:.2rem .4rem;border-radius:4px;transition:color .2s,background .2s}
  .menu-idiomas a:hover{color:var(--creme)}
  .menu-idiomas a.idioma-atual{color:var(--noite);background:var(--agua)}
  .btn-movimento{
    display:flex;align-items:center;gap:.5rem;cursor:pointer;background:none;border:0;
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--creme-40);transition:color .25s;
  }
  .btn-movimento:hover{color:var(--creme)}
  .btn-movimento .luz{width:8px;height:8px;border-radius:50%;background:var(--agua);box-shadow:0 0 8px var(--agua);transition:background .25s, box-shadow .25s}
  .btn-movimento[aria-pressed="false"] .luz{background:var(--creme-40);box-shadow:none}
  /* movimento desligado: mesma regra do prefers-reduced-motion */
  body.sem-movimento *,body.sem-movimento *::before,body.sem-movimento *::after{
    animation:none !important;transition:none !important;
  }

  /* ---- SELETOR DE IDIOMA ---- */
  .seletor-idioma{display:flex;gap:.25rem;align-items:center;margin-left:auto;margin-right:.9rem}
  .seletor-idioma a{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;
    color:var(--creme-40);padding:.3rem .5rem;border-radius:5px;line-height:1;
    transition:color .2s, background .2s;
  }
  .seletor-idioma a:hover{color:var(--creme)}
  .seletor-idioma a.idioma-atual{color:var(--noite);background:var(--agua);font-weight:500}
  @media(max-width:860px){.seletor-idioma{margin-right:.4rem;gap:.1rem}.seletor-idioma a{padding:.28rem .38rem;font-size:.64rem}}

  /* ---- BARRA DE PROGRESSO (scroll-driven, sem JS) ---- */
  @supports (animation-timeline: scroll()){
    .progresso{
      position:fixed;top:0;left:0;right:0;height:3px;z-index:100;
      background:linear-gradient(90deg,var(--magenta),var(--laranja),var(--agua));
      transform-origin:left;transform:scaleX(0);
      animation:crescer linear both;
      animation-timeline:scroll(root block);
    }
    @keyframes crescer{to{transform:scaleX(1)}}
  }

  /* ============ TICKER ============ */
  .ticker{
    background:var(--magenta);color:var(--noite);
    font-family:var(--font-mono);font-size:.78rem;letter-spacing:.04em;
    padding:.45rem 0;overflow:hidden;white-space:nowrap;
    position:relative;z-index:60;
  }
  .ticker__faixa{display:inline-flex;animation:rolar 36s linear infinite;will-change:transform}
  .ticker__faixa span{margin-right:3.5rem;flex-shrink:0}
  @keyframes rolar{to{transform:translateX(-50%)}}

  /* ============ NAV ============ */
  nav{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:1rem clamp(1.2rem,5vw,4rem);
    border-bottom:1px solid var(--linha);
    position:sticky;top:0;z-index:50;
    background:rgba(18,7,32,.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .marca{font-family:var(--font-display);font-size:1.7rem;letter-spacing:.08em;color:var(--creme)}
  .marca em{font-style:normal;color:var(--magenta)}
  .nav-links{display:flex;gap:1.6rem;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;align-items:center}
  .nav-links a{color:var(--creme-70);position:relative;transition:color .25s}
  .nav-links a::after{
    content:"";position:absolute;left:0;bottom:-5px;width:100%;height:1px;
    background:var(--agua);transform:scaleX(0);transform-origin:right;transition:transform .3s ease;
  }
  .nav-links a:hover{color:var(--agua)}
  .nav-links a:hover::after{transform:scaleX(1);transform-origin:left}
  .nav-social{display:flex;gap:.7rem;align-items:center}
  .nav-social a{
    width:32px;height:32px;border:1px solid var(--linha);border-radius:50%;
    display:grid;place-items:center;transition:border-color .25s,box-shadow .25s,transform .25s;
  }
  .nav-social a:hover{border-color:var(--agua);box-shadow:0 0 12px rgba(47,230,200,.45);transform:translateY(-2px)}
  .nav-social a{color:var(--creme-70)}
  .nav-social svg{width:14px;height:14px;fill:currentColor}
  .nav-social a:hover{color:var(--agua)}
  @media(max-width:860px){
    nav{flex-wrap:wrap;gap:.6rem;padding:.85rem 1rem}
    .marca{font-size:1.45rem}
    .nav-links{
      order:3;width:100%;gap:1.1rem;
      overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
      padding-bottom:.15rem;
    }
    .nav-links::-webkit-scrollbar{display:none}
    .nav-links a{white-space:nowrap;flex-shrink:0}
    .nav-social a{width:30px;height:30px}
  }

  /* ============ HERO ============ */
  header.hero{
    position:relative;
    min-height:96vh;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;
    padding:5rem 1.2rem max(150px, calc(22vw + 2rem));
    overflow:hidden;
    isolation:isolate;
  }
  /* céu vivo, respirando entre tons */
  .ceu{
    position:absolute;inset:0;z-index:-4;
    background:
      radial-gradient(ellipse 130% 60% at 50% 112%, rgba(255,138,61,.55), transparent 62%),
      radial-gradient(ellipse 95% 50% at 50% 116%, rgba(255,61,138,.6), transparent 68%),
      radial-gradient(ellipse 70% 40% at 50% 118%, rgba(123,61,255,.35), transparent 70%),
      linear-gradient(180deg, var(--noite) 0%, var(--noite-2) 50%, #2B0F44 100%);
  }
  /* segunda camada de cor: o céu "respira" animando só a opacidade (GPU) */
  .ceu::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 110% 55% at 50% 112%, rgba(123,61,255,.5), transparent 64%),
      radial-gradient(ellipse 80% 45% at 50% 116%, rgba(255,61,138,.45), transparent 68%);
    opacity:0;
    animation:respirar 12s ease-in-out infinite alternate;
    will-change:opacity;
  }
  @keyframes respirar{from{opacity:0}to{opacity:.8}}
  /* estrelas piscando */
  .estrelas{position:absolute;inset:0;z-index:-3;pointer-events:none}
  .estrelas i{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:var(--creme);
    animation:piscar 4s ease-in-out infinite;
  }
  @keyframes piscar{0%,100%{opacity:.15}50%{opacity:.9}}
  /* vagalumes de neon */
  .vagalumes{position:absolute;inset:0;z-index:-1;pointer-events:none}
  .vagalumes i{
    position:absolute;width:5px;height:5px;border-radius:50%;
    background:var(--agua);
    box-shadow:0 0 10px var(--agua),0 0 22px rgba(47,230,200,.5);
    animation:flutuar 14s ease-in-out infinite;
    opacity:.7;
  }
  .vagalumes i:nth-child(even){background:var(--magenta);box-shadow:0 0 10px var(--magenta),0 0 22px rgba(255,61,138,.5)}
  @keyframes flutuar{
    0%,100%{transform:translate(0,0) scale(1)}
    25%{transform:translate(34px,-46px) scale(1.25)}
    50%{transform:translate(-22px,-90px) scale(.85)}
    75%{transform:translate(-48px,-30px) scale(1.1)}
  }
  /* sol nascendo */
  .sol{
    position:absolute;bottom:-5vw;left:50%;
    width:min(320px,40vw);aspect-ratio:1;border-radius:50%;
    background:linear-gradient(180deg,var(--laranja),var(--magenta) 75%);
    z-index:-2;
    -webkit-mask:repeating-linear-gradient(180deg,#000 0 22px,transparent 22px 30px);
    mask:repeating-linear-gradient(180deg,#000 0 22px,transparent 22px 30px);
    transform:translateX(-50%) translateY(46%);
    animation:nascer 2.6s cubic-bezier(.22,1,.36,1) .3s forwards;
    will-change:transform;
  }
  @keyframes nascer{to{transform:translateX(-50%) translateY(8%)}}
  /* halo do sol: div separada pulsando só a opacidade (GPU) */
  .sol-halo{
    position:absolute;bottom:-12vw;left:50%;transform:translateX(-50%);
    width:min(470px,58vw);aspect-ratio:1;border-radius:50%;z-index:-3;
    background:radial-gradient(circle, rgba(255,61,138,.4), rgba(255,138,61,.2) 45%, transparent 70%);
    animation:pulsarHalo 7s ease-in-out infinite alternate;
    will-change:opacity;
  }
  @keyframes pulsarHalo{from{opacity:.55}to{opacity:1}}
  /* palmeiras */
  .horizonte{
    position:absolute;bottom:-1px;left:0;width:100%;height:auto;
    pointer-events:none;z-index:1;display:block;
  }
  .horizonte .palma{animation:brisa 8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
  .horizonte .palma:nth-of-type(2){animation-delay:-2.6s;animation-duration:9.5s}
  .horizonte .palma:nth-of-type(3){animation-delay:-1.3s;animation-duration:7s}
  .horizonte .palma:nth-of-type(4){animation-delay:-4s;animation-duration:10s}
  @keyframes brisa{from{transform:rotate(-.9deg)}to{transform:rotate(1.1deg)}}
  .horizonte .janelas{animation:janelaPisca 6s ease-in-out infinite alternate}
  @keyframes janelaPisca{from{opacity:.35}to{opacity:.75}}

  /* entrada orquestrada */
  .subir{opacity:0;transform:translateY(26px);animation:subir 1s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes subir{to{opacity:1;transform:none}}
  .d1{animation-delay:.2s}.d2{animation-delay:.45s}.d3{animation-delay:.7s}.d4{animation-delay:1s}.d5{animation-delay:1.3s}

  .hero__eyebrow{
    font-family:var(--font-mono);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;
    color:var(--agua);margin-bottom:1.4rem;position:relative;z-index:2;
  }
  .hero__eyebrow::before,.hero__eyebrow::after{content:"— ";color:var(--magenta)}
  .hero__eyebrow::after{content:" —"}

  h1.hero__titulo{
    font-family:var(--font-display);
    font-size:clamp(4rem,15vw,11.5rem);
    line-height:.9;letter-spacing:.02em;
    position:relative;z-index:2;
    text-shadow:0 0 30px rgba(255,61,138,.5), 0 0 90px rgba(255,138,61,.3);
    animation:neonFlicker 9s linear infinite 2.4s;
  }
  h1 .vice{color:var(--magenta)}
  h1 .versa{color:var(--creme)}
  /* glitch de aberração cromática */
  .glitch{position:relative;display:inline-block}
  .glitch::before,.glitch::after{
    content:attr(data-texto);
    position:absolute;inset:0;
    opacity:0;pointer-events:none;
  }
  .glitch::before{color:var(--agua);z-index:-1}
  .glitch::after{color:var(--laranja);z-index:-2}
  .glitch.ativo::before{opacity:.85;animation:glitchA .34s steps(2,end)}
  .glitch.ativo::after{opacity:.85;animation:glitchB .34s steps(2,end)}
  @keyframes glitchA{
    0%{transform:translate(-6px,2px);clip-path:inset(12% 0 58% 0)}
    50%{transform:translate(5px,-3px);clip-path:inset(58% 0 8% 0)}
    100%{transform:translate(0,0);clip-path:inset(0 0 0 0);opacity:0}
  }
  @keyframes glitchB{
    0%{transform:translate(6px,-2px);clip-path:inset(48% 0 22% 0)}
    50%{transform:translate(-5px,3px);clip-path:inset(4% 0 72% 0)}
    100%{transform:translate(0,0);clip-path:inset(0 0 0 0);opacity:0}
  }
  @keyframes neonFlicker{
    0%,7%,9%,100%{opacity:1}
    8%{opacity:.55}
    42%,44%{opacity:1}
    43%{opacity:.7}
  }

  .hero__sub{
    max-width:580px;margin:1.5rem auto 0;color:var(--creme-70);
    font-size:1rem;position:relative;z-index:2;
  }

  /* contagem regressiva */
  .contagem{
    position:relative;z-index:2;margin-top:2.6rem;
    display:flex;gap:clamp(.6rem,3vw,1.6rem);
    padding:1.2rem clamp(1rem,4vw,2.4rem);
    border:1px solid var(--magenta);border-radius:8px;
    background:rgba(18,7,32,.6);
    box-shadow:0 0 24px rgba(255,61,138,.35), inset 0 0 24px rgba(255,61,138,.12);
  }
  /* pulso da borda: camada extra animando só a opacidade */
  .contagem::after{
    content:"";position:absolute;inset:-1px;border-radius:8px;pointer-events:none;
    box-shadow:0 0 42px rgba(255,61,138,.6), inset 0 0 30px rgba(255,61,138,.2);
    opacity:0;
    animation:pulsoBorda 4s ease-in-out infinite;
    will-change:opacity;
  }
  @keyframes pulsoBorda{0%,100%{opacity:0}50%{opacity:1}}
  .contagem div{text-align:center;min-width:64px}
  .contagem b{
    display:block;font-family:var(--font-display);font-weight:400;
    font-size:clamp(2.2rem,7vw,3.8rem);line-height:1;color:var(--agua);
    text-shadow:0 0 16px rgba(47,230,200,.65);
    font-variant-numeric:tabular-nums;
  }
  .contagem b.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{40%{transform:scale(1.22);color:var(--creme)}}
  .contagem small{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--creme-40)}
  .contagem__label{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--noite);padding:0 .8rem;white-space:nowrap;
    font-family:var(--font-mono);font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--magenta);
  }

  /* redes no hero */
  .hero__social{
    position:relative;z-index:2;margin-top:2.2rem;
    display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;
  }
  .pilula{
    display:inline-flex;align-items:center;gap:.55rem;
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.1em;
    color:var(--creme);border:1px solid var(--linha);border-radius:999px;
    padding:.55rem 1.1rem;background:rgba(18,7,32,.55);
    transition:border-color .25s, box-shadow .25s, transform .25s;
  }
  .pilula svg{width:15px;height:15px;fill:currentColor;transition:transform .3s}
  .pilula:hover{transform:translateY(-3px)}
  .pilula:hover svg{transform:rotate(-10deg) scale(1.15)}
  .pilula--ig:hover{border-color:#FF3D8A;box-shadow:0 0 18px rgba(255,61,138,.5);color:#FF9BC4}
  .pilula--x:hover{border-color:var(--creme);box-shadow:0 0 18px rgba(255,243,228,.35)}
  .pilula--tt:hover{border-color:var(--agua);box-shadow:0 0 18px rgba(47,230,200,.5);color:var(--agua)}
  .pilula--yt:hover{border-color:#FF5A5A;box-shadow:0 0 18px rgba(255,90,90,.5);color:#FF9B9B}

  /* seta de scroll */
  .scroll-dica{
    position:relative;z-index:3;margin-top:2.6rem;
    display:inline-flex;align-items:center;gap:.6rem;
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--creme-70);
    border:1px solid var(--linha);border-radius:999px;
    padding:.55rem 1.3rem;
    background:rgba(18,7,32,.55);
    transition:color .25s, border-color .25s, box-shadow .25s;
  }
  .scroll-dica:hover{color:var(--agua);border-color:var(--agua);box-shadow:0 0 16px rgba(47,230,200,.35)}
  .scroll-dica .seta{animation:balanco 2s ease-in-out infinite;display:inline-block}
  @keyframes balanco{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  /* ============ SEÇÕES ============ */
  section{padding:6rem clamp(1.2rem,6vw,5rem);position:relative}
  section + section::before{
    content:"";position:absolute;top:0;left:clamp(1.2rem,6vw,5rem);right:clamp(1.2rem,6vw,5rem);
    height:1px;background:linear-gradient(90deg,transparent,var(--linha),transparent);
  }
  @media(max-width:640px){section{padding:4rem 1.2rem}}
  .secao__cabeca{display:flex;align-items:baseline;gap:1.2rem;margin-bottom:2.8rem;flex-wrap:wrap}
  .secao__cabeca h2{
    font-family:var(--font-display);font-size:clamp(2.3rem,5vw,3.6rem);
    letter-spacing:.04em;font-weight:400;position:relative;padding-bottom:.35rem;
  }
  .secao__cabeca h2::after{
    content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--magenta),var(--laranja),transparent);
    transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.22,1,.36,1) .2s;
  }
  .visivel .secao__cabeca h2::after{transform:scaleX(1)}
  .secao__cabeca .tag{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--noite);background:var(--agua);padding:.25rem .7rem;border-radius:3px;
  }

  /* revelação no scroll */
  .revela{opacity:0;transform:translateY(34px);transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1)}
  .visivel .revela{opacity:1;transform:none}
  .visivel .revela:nth-child(1){transition-delay:.05s}
  .visivel .revela:nth-child(2){transition-delay:.15s}
  .visivel .revela:nth-child(3){transition-delay:.25s}
  .visivel .revela:nth-child(4){transition-delay:.35s}
  .visivel .revela:nth-child(5){transition-delay:.45s}
  .visivel .revela:nth-child(6){transition-delay:.55s}

  /* ---- Notícias ---- */
  .noticia__risco{
    position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--magenta),var(--laranja));
    transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  article.noticia:hover .noticia__risco{transform:scaleX(1)}
  .grade-noticias{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.4rem}
  article.noticia{
    background:var(--card);
    border:1px solid var(--linha);border-radius:12px;
    padding:1.7rem 1.6rem 1.5rem;
    display:flex;flex-direction:column;gap:.8rem;
    position:relative;overflow:hidden;
    transition:border-color .3s, box-shadow .3s;
    transform-style:preserve-3d;will-change:transform;
  }
  article.noticia::before{ /* brilho que varre o card */
    content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,243,228,.09),transparent);
    transform:skewX(-18deg);transition:left .7s ease;pointer-events:none;
  }
  article.noticia:hover::before{left:130%}
  article.noticia:hover{border-color:var(--magenta);box-shadow:0 14px 40px rgba(255,61,138,.18)}
  .noticia__meta{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--laranja)}
  .noticia h3{font-weight:700;font-size:1.12rem;line-height:1.35}
  .noticia p{font-size:.9rem;color:var(--creme-70)}
  .noticia--destaque{
    grid-column:1/-1;
    background:linear-gradient(135deg,rgba(255,61,138,.15),rgba(255,138,61,.08));
    border-color:var(--magenta);
  }
  .noticia--destaque h3{font-size:clamp(1.4rem,3vw,1.9rem)}
  .badge-vivo{
    display:inline-flex;align-items:center;gap:.4rem;
  }
  .badge-vivo::before{
    content:"";width:8px;height:8px;border-radius:50%;background:var(--magenta);
    animation:vivo 1.4s ease-in-out infinite;
  }
  @keyframes vivo{0%,100%{box-shadow:0 0 0 0 rgba(255,61,138,.7)}70%{box-shadow:0 0 0 9px rgba(255,61,138,0)}}

  /* ---- Cronologia ---- */
  .cronologia{position:relative;max-width:820px;margin:0 auto}
  .cronologia::before{
    content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;
    background:linear-gradient(180deg,var(--agua),var(--magenta),var(--laranja));
    transform:scaleY(0);transform-origin:top;
    transition:transform 1.6s cubic-bezier(.22,1,.36,1) .2s;
  }
  .visivel .cronologia::before{transform:scaleY(1)}
  .evento{position:relative;padding:0 0 2.4rem 2.6rem}
  .evento:last-child{padding-bottom:0}
  .evento::before{
    content:"";position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;
    background:var(--noite);border:3px solid var(--agua);
    box-shadow:0 0 12px rgba(47,230,200,.5);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  }
  .evento:hover::before{transform:scale(1.35)}
  .evento--quente::before{border-color:var(--magenta);box-shadow:0 0 12px rgba(255,61,138,.55)}
  .evento time{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--agua)}
  .evento h3{font-weight:700;font-size:1.05rem;margin:.3rem 0}
  .evento p{font-size:.9rem;color:var(--creme-70);max-width:620px}

  /* ---- Curiosidades ---- */
  .grade-curio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem;counter-reset:caso}
  .curio{
    counter-increment:caso;
    background:var(--card);
    border:1px dashed rgba(47,230,200,.35);border-radius:12px;
    padding:1.6rem 1.5rem;position:relative;
    transition:border-color .3s, background .3s, transform .3s;
  }
  .curio:hover{border-style:solid;border-color:var(--agua);background:rgba(47,230,200,.05);transform:translateY(-4px)}
  .curio::before{
    content:"ARQUIVO Nº " counter(caso, decimal-leading-zero);
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.24em;color:var(--agua);
    display:block;margin-bottom:.9rem;
  }
  .curio h3{font-weight:700;font-size:1.02rem;margin-bottom:.5rem}
  .curio p{font-size:.88rem;color:var(--creme-70)}
  .curio strong{color:var(--laranja);font-weight:600}

  /* ---- BARRA "HOJE" (evento ao vivo) ---- */
  .barra-evento{
    display:flex;align-items:center;justify-content:center;gap:.9rem;flex-wrap:wrap;
    background:linear-gradient(90deg,rgba(255,61,138,.22),rgba(255,138,61,.18),rgba(255,61,138,.22));
    border-bottom:1px solid var(--magenta);
    padding:.7rem 1.2rem;text-align:center;
    font-family:var(--font-mono);font-size:.76rem;letter-spacing:.06em;
  }
  .barra-evento strong{color:var(--creme);font-weight:500}
  .barra-evento .relogio{color:var(--agua);font-variant-numeric:tabular-nums}
  .barra-evento a{
    border:1px solid var(--agua);border-radius:999px;padding:.25rem .8rem;
    font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  }

  /* contagem secundária (evento de hoje) */
  .contagem-evento{
    position:relative;z-index:2;margin-top:1rem;
    display:inline-flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:center;
    border:1px dashed var(--agua);border-radius:999px;padding:.5rem 1.2rem;
    font-family:var(--font-mono);font-size:.74rem;color:var(--creme-70);
  }
  .contagem-evento b{color:var(--agua);font-variant-numeric:tabular-nums;font-weight:500}

  /* ---- ANÚNCIOS ---- */
  .anuncio{
    max-width:1040px;margin:0 auto;padding:0 clamp(1.2rem,6vw,5rem);
    text-align:center;
  }
  .anuncio__rotulo{
    display:block;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.24em;
    text-transform:uppercase;color:var(--creme-40);margin-bottom:.5rem;
  }
  /* altura reservada por faixa: o espaço já existe antes de o anúncio carregar */
  .anuncio__slot{
    display:block;width:100%;margin:0 auto;overflow:hidden;
    background:rgba(255,243,228,.03);
    border:1px dashed var(--linha);border-radius:10px;
    min-height:280px;
  }
  @media(min-width:768px){.anuncio__slot{min-height:250px;max-width:728px}}
  @media(min-width:1100px){.anuncio__slot{max-width:970px;min-height:250px}}
  .anuncio--vazio .anuncio__slot{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:.66rem;color:var(--creme-40);
    letter-spacing:.1em;padding:1rem;
  }
  section + .anuncio{padding-top:2.5rem}
  .anuncio + section{padding-top:2.5rem}

  /* ---- MAPA INTERATIVO ---- */
  #mapa{background:radial-gradient(ellipse 70% 60% at 50% 0%, rgba(47,230,200,.09), transparent 62%)}
  .mapa-wrap{
    display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,360px);
    gap:clamp(1.2rem,3vw,2.2rem);align-items:start;max-width:1080px;margin:0 auto;
  }
  @media(max-width:900px){.mapa-wrap{grid-template-columns:1fr}}

  .mapa-palco{
    position:relative;border:1px solid var(--linha);border-radius:16px;
    overflow:hidden;background:#061E33;touch-action:none;
  }
  .mapa-svg{width:100%;height:auto;display:block;cursor:grab}
  .mapa-palco.arrastando .mapa-svg{cursor:grabbing}

  .regiao,.marco{cursor:pointer}
  .regiao .forma{transition:opacity .25s, filter .25s}
  .mapa-svg:hover .regiao:not(:hover) .forma{opacity:.34}
  .regiao:hover .forma,.regiao.ativa .forma{opacity:.88;filter:saturate(1.35) brightness(1.1)}
  .contorno{fill:none;stroke:transparent;stroke-width:2.5;transition:stroke .25s}
  .regiao:hover .contorno,.regiao.ativa .contorno,.regiao:focus-visible .contorno{stroke:var(--creme)}
  .regiao:focus-visible,.marco:focus-visible{outline:none}

  .marco .pino{fill:#0B0414;stroke:#FFF3E4;stroke-width:1.4;transition:stroke .25s, fill .25s}
  .marco .glifo{fill:#FFF3E4;transition:fill .25s}
  .marco:hover .pino,.marco.ativa .pino,.marco:focus-visible .pino{fill:var(--agua);stroke:var(--creme)}
  .marco:hover .glifo,.marco.ativa .glifo,.marco:focus-visible .glifo{fill:#0B0414}

  .rotulo{font-family:var(--font-body);font-weight:700;font-size:15px;fill:#0B0414;text-anchor:middle;pointer-events:none}
  .rotulo-agua{font-family:var(--font-mono);font-size:12px;fill:#EAF6FF;text-anchor:middle;pointer-events:none}
  .rotulo-keys{font-family:var(--font-mono);font-size:12px;fill:#3E9E86;text-anchor:middle;pointer-events:none}
  .rotulo-vizinho{font-family:var(--font-mono);font-size:11px;fill:#9FB6C9;text-anchor:middle;letter-spacing:3px;pointer-events:none}
  .bussola,.escala{pointer-events:none;opacity:.85}
  .bussola text,.escala text{font-family:var(--font-mono);font-size:8px;fill:#FFF3E4;text-anchor:middle}
  .escala text{font-size:9px}

  /* controles de zoom */
  .mapa-ctrl{position:absolute;top:.7rem;right:.7rem;display:flex;flex-direction:column;gap:.35rem}
  .mapa-ctrl button{
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    background:rgba(11,4,20,.75);border:1px solid var(--linha);color:var(--creme);
    font-family:var(--font-mono);font-size:1rem;line-height:1;
    display:grid;place-items:center;transition:border-color .2s, background .2s;
  }
  .mapa-ctrl button:hover{border-color:var(--agua);background:rgba(47,230,200,.16)}

  /* legenda de camadas */
  .mapa-legenda{
    position:absolute;left:.7rem;bottom:.7rem;display:flex;gap:.35rem;flex-wrap:wrap;
  }
  .mapa-legenda button{
    font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
    background:rgba(11,4,20,.75);border:1px solid var(--linha);color:var(--creme-70);
    border-radius:999px;padding:.3rem .65rem;cursor:pointer;transition:all .2s;
  }
  .mapa-legenda button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
  .mapa-legenda button:hover{border-color:var(--agua);color:var(--creme)}

  /* painel lateral */
  .mapa-painel{
    border:1px solid var(--linha);border-radius:16px;background:var(--card);
    padding:1.5rem;position:sticky;top:100px;
  }
  @media(max-width:900px){.mapa-painel{position:static}}
  .mapa-painel .cor{width:34px;height:5px;border-radius:3px;display:block;margin-bottom:.9rem;background:var(--agua)}
  .mapa-painel h4{font-family:var(--font-display);font-weight:400;font-size:1.9rem;letter-spacing:.03em;line-height:1}
  .mapa-painel .real{
    font-family:var(--font-mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--laranja);margin:.45rem 0 .9rem;display:block;
  }
  .mapa-painel p{font-size:.89rem;color:var(--creme-70)}
  .mapa-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:1.1rem}
  .mapa-tags span{
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--linha);border-radius:999px;padding:.28rem .6rem;color:var(--creme-40);
  }
  .mapa-dica{
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--creme-40);margin-top:1.3rem;display:block;line-height:1.7;
  }
  .mapa-nota{max-width:1080px;margin:1.8rem auto 0;font-size:.75rem;color:var(--creme-40);line-height:1.7;text-align:center}

  /* ---- EBOOK ---- */
  #ebook{
    background:
      radial-gradient(ellipse 60% 70% at 12% 10%, rgba(47,230,200,.10), transparent 62%),
      radial-gradient(ellipse 60% 70% at 92% 95%, rgba(255,61,138,.14), transparent 62%);
  }
  .oferta{
    max-width:1040px;margin:0 auto;position:relative;
    border:1px solid var(--linha);border-radius:20px;
    background:linear-gradient(160deg, rgba(255,243,228,.05), rgba(255,61,138,.045));
    padding:clamp(1.8rem,4vw,3.2rem);
    display:grid;grid-template-columns:minmax(190px,270px) 1fr;gap:clamp(1.8rem,5vw,3.6rem);
    align-items:center;overflow:hidden;
  }
  .oferta::before{ /* brilho de canto */
    content:"";position:absolute;top:-45%;right:-15%;width:55%;height:180%;
    background:radial-gradient(ellipse at center, rgba(255,61,138,.18), transparent 62%);
    pointer-events:none;
  }
  @media(max-width:860px){
    .oferta{grid-template-columns:1fr;text-align:center;justify-items:center;gap:2.2rem}
  }

  /* o livro */
  .livro{position:relative;width:100%;max-width:270px;perspective:1400px}
  .livro__corpo{
    position:relative;display:block;
    transform:rotateY(-13deg) rotateZ(-1deg);
    transition:transform .55s cubic-bezier(.22,1,.36,1);
  }
  .livro:hover .livro__corpo{transform:rotateY(-4deg) rotateZ(0deg) translateY(-6px)}
  .livro__capa{
    display:block;width:100%;height:auto;
    border-radius:3px 9px 9px 3px;
    box-shadow:
      2px 0 0 #efe6d6, 4px 0 0 #cdbfa9, 6px 0 0 #efe6d6,
      8px 0 0 #c4b49c, 10px 0 0 #efe6d6, 12px 0 0 #b9a892,
      0 0 0 1px rgba(255,243,228,.14),
      26px 32px 46px -18px rgba(0,0,0,.75),
      0 18px 60px -24px rgba(255,61,138,.6);
  }
  .livro__lombada{ /* sombra da dobra, junto da lombada */
    position:absolute;inset:0 auto 0 0;width:13%;
    background:linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.18) 45%, transparent);
    border-radius:3px 0 0 3px;pointer-events:none;
  }
  .livro__brilho{ /* reflexo diagonal no verniz */
    position:absolute;inset:0;pointer-events:none;border-radius:3px 9px 9px 3px;
    background:linear-gradient(114deg, transparent 42%, rgba(255,243,228,.14) 50%, transparent 58%);
  }
  .livro__selo{
    position:absolute;top:-14px;left:-14px;z-index:3;
    background:var(--agua);color:var(--noite);
    font-family:var(--font-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;
    padding:.4rem .7rem;border-radius:6px;
    box-shadow:0 6px 18px -4px rgba(47,230,200,.8);
    transform:rotate(-7deg);
  }

  /* texto da oferta */
  .oferta__txt{position:relative;z-index:2}
  .oferta__selo{
    display:inline-block;margin-bottom:1rem;
    font-family:var(--font-mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--magenta);border:1px solid var(--magenta);border-radius:999px;padding:.3rem .85rem;
  }
  .oferta__txt h3{
    font-family:var(--font-display);font-weight:400;
    font-size:clamp(2rem,4.6vw,3.1rem);line-height:.98;letter-spacing:.02em;
  }
  .oferta__txt h3 span{color:var(--agua)}
  .oferta__linha{font-size:.94rem;color:var(--creme-70);margin:1rem 0 1.5rem;max-width:520px}
  @media(max-width:860px){.oferta__linha{margin-inline:auto}}

  .oferta__itens{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));
    gap:.55rem .9rem;margin-bottom:1.7rem;text-align:left;
  }
  .oferta__itens li{
    list-style:none;display:flex;align-items:flex-start;gap:.5rem;
    font-size:.85rem;color:var(--creme-70);
  }
  .oferta__itens li::before{
    content:"";flex-shrink:0;margin-top:.42em;width:6px;height:6px;border-radius:50%;
    background:var(--agua);box-shadow:0 0 8px rgba(47,230,200,.9);
  }

  .oferta__preco{
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;
    padding:1rem 1.3rem;border-radius:12px;
    background:rgba(11,4,20,.5);border:1px solid var(--linha);
  }
  @media(max-width:860px){.oferta__preco{justify-content:center}}
  .oferta__preco .de{font-family:var(--font-mono);font-size:.85rem;color:var(--creme-40);text-decoration:line-through}
  .oferta__preco .por{font-family:var(--font-display);font-size:3.2rem;line-height:.85;color:var(--creme)}
  .oferta__preco .por small{font-size:1.1rem;color:var(--creme-70);margin-right:.15rem;vertical-align:.7rem}
  .oferta__preco .off{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;font-weight:500;
    background:var(--agua);color:var(--noite);border-radius:5px;padding:.3rem .6rem;
    margin-left:auto;
  }
  @media(max-width:860px){.oferta__preco .off{margin-left:0}}

  .btn-ebook{
    display:inline-flex;align-items:center;gap:.65rem;position:relative;overflow:hidden;
    background:linear-gradient(100deg,var(--magenta),#FF5FA0);
    color:var(--noite);
    font-family:var(--font-mono);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
    border-radius:999px;padding:1.05rem 2.3rem;
    box-shadow:0 12px 34px -10px rgba(255,61,138,.9);
    transition:transform .25s, box-shadow .25s;
  }
  .btn-ebook::after{content:"→";transition:transform .25s}
  .btn-ebook::before{
    content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-20deg);transition:left .6s ease;
  }
  .btn-ebook:hover{transform:translateY(-3px);box-shadow:0 18px 44px -10px rgba(255,61,138,1);color:var(--noite)}
  .btn-ebook:hover::after{transform:translateX(5px)}
  .btn-ebook:hover::before{left:130%}
  .oferta__nota{font-size:.75rem;color:var(--creme-40);margin-top:1.1rem;max-width:500px;line-height:1.6}
  @media(max-width:860px){.oferta__nota{margin-inline:auto}}

  /* ---- PLANTÃO (feed vindo do X) ---- */
  .painel-largo{max-width:900px;margin:0 auto}
  .painel__link{
    display:inline-block;margin-top:1.2rem;
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;
    border:1px solid var(--linha);border-radius:999px;padding:.5rem 1.1rem;
    color:var(--creme-70);transition:border-color .25s,color .25s;
  }
  .painel__link:hover{border-color:var(--agua);color:var(--agua)}
  .painel{
    border:1px solid var(--linha);border-radius:14px;background:var(--card);
    padding:1.3rem;position:relative;overflow:hidden;
  }
  .painel__titulo{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--laranja);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;
  }
  .feed-auto{display:flex;flex-direction:column;gap:.9rem}
  .post-auto{
    border:1px solid rgba(47,230,200,.25);border-left:3px solid var(--agua);
    border-radius:10px;padding:1rem 1.2rem;background:var(--card);
  }
  .post-auto time{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--agua)}
  .post-auto h4{font-weight:700;font-size:.98rem;margin:.3rem 0 .25rem}
  .post-auto p{font-size:.86rem;color:var(--creme-70)}
  .post-auto__img{
    display:block;width:100%;height:auto;
    /* contain + altura generosa: a imagem aparece INTEIRA, sem corte.
       O teto evita que uma imagem muito vertical domine a tela. */
    max-height:min(620px,80vh);object-fit:contain;
    border-radius:8px;margin:.8rem 0 .3rem;
    border:1px solid var(--linha);background:rgba(11,4,20,.45);
  }
  .feed-vazio{font-size:.86rem;color:var(--creme-40);padding:1rem;border:1px dashed var(--linha);border-radius:10px}

  /* ---- SIGA O SINAL (redes) ---- */
  #siga{
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(123,61,255,.15), transparent 60%),
      radial-gradient(ellipse 60% 50% at 50% 110%, rgba(255,61,138,.18), transparent 65%);
    text-align:center;
  }
  #siga .secao__cabeca{justify-content:center}
  #siga .chamada{max-width:520px;margin:-1.2rem auto 3rem;color:var(--creme-70);font-size:.95rem}
  .grade-social{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:1.5rem;max-width:1100px;margin:0 auto;
  }
  .card-social{
    --cor:var(--magenta);
    position:relative;
    border:1px solid var(--linha);border-radius:16px;
    padding:2.4rem 1.6rem 2rem;
    background:var(--card);
    display:flex;flex-direction:column;align-items:center;gap:.9rem;
    overflow:hidden;
    transition:transform .35s cubic-bezier(.22,1,.36,1), border-color .35s, box-shadow .35s;
  }
  .card-social::after{ /* aurora interna */
    content:"";position:absolute;inset:-40%;
    background:radial-gradient(circle at 50% 120%, var(--cor), transparent 55%);
    opacity:.12;transition:opacity .4s;pointer-events:none;
  }
  .card-social:hover{transform:translateY(-8px);border-color:var(--cor);box-shadow:0 18px 50px -12px var(--cor)}
  .card-social:hover::after{opacity:.3}
  .card-social--ig{--cor:#FF3D8A}
  .card-social--x{--cor:#FFF3E4}
  .card-social--tt{--cor:#2FE6C8}
  .card-social--yt{--cor:#FF5A5A}
  .card-social .icone{
    width:64px;height:64px;border-radius:18px;
    display:grid;place-items:center;
    border:1px solid var(--cor);
    box-shadow:0 0 22px -6px var(--cor), inset 0 0 18px -8px var(--cor);
    animation:levitar 5s ease-in-out infinite;
  }
  .card-social:nth-child(2) .icone{animation-delay:1.2s}
  .card-social:nth-child(3) .icone{animation-delay:2.4s}
  .card-social:nth-child(4) .icone{animation-delay:3.6s}
  @keyframes levitar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .card-social .icone{color:var(--creme)}
  .card-social .icone svg{width:30px;height:30px;fill:currentColor}
  .card-social .rede{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--creme-40)}
  .card-social .arroba{
    font-family:var(--font-display);font-size:2.1rem;letter-spacing:.05em;line-height:1;
    color:var(--creme);text-shadow:0 0 18px var(--cor);
  }
  .card-social .cta{
    font-family:var(--font-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cor);margin-top:.3rem;display:inline-flex;align-items:center;gap:.4rem;
  }
  .card-social .cta::after{content:"→";transition:transform .3s}
  .card-social:hover .cta::after{transform:translateX(5px)}

  /* ---- FAQ ---- */
  .faq{max-width:780px;margin:0 auto}
  details{
    border:1px solid var(--linha);border-radius:10px;
    margin-bottom:.9rem;background:var(--card);overflow:hidden;
    transition:border-color .3s;
  }
  details[open]{border-color:var(--agua)}
  summary{
    cursor:pointer;padding:1.1rem 1.4rem;font-weight:600;font-size:.98rem;
    list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-family:var(--font-display);font-size:1.5rem;color:var(--magenta);transition:transform .3s}
  details[open] summary::after{transform:rotate(45deg);color:var(--agua)}
  details p{padding:0 1.4rem 1.2rem;font-size:.9rem;color:var(--creme-70)}

  /* ---- FOOTER ---- */
  footer{
    border-top:1px solid var(--linha);
    padding:3.5rem clamp(1.2rem,6vw,5rem) 2.5rem;
    text-align:center;position:relative;overflow:hidden;
  }
  footer::before{
    content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--magenta),var(--agua),transparent);
    animation:varrer 5s linear infinite;
    background-size:200% 100%;
  }
  @keyframes varrer{to{background-position:-200% 0}}
  footer .marca{font-size:2.4rem;display:block;margin-bottom:1rem}
  .footer-social{display:flex;justify-content:center;gap:1rem;margin-bottom:1.6rem}
  .footer-social a{
    width:44px;height:44px;border:1px solid var(--linha);border-radius:50%;
    display:grid;place-items:center;
    transition:border-color .3s, box-shadow .3s, transform .3s;
  }
  .footer-social a{color:var(--creme-70);transition:color .3s}
  .footer-social svg{width:18px;height:18px;fill:currentColor}
  .footer-social a:hover{transform:translateY(-4px) rotate(6deg);border-color:var(--agua);box-shadow:0 0 16px rgba(47,230,200,.4)}
  .footer-social a:hover{color:var(--agua)}
  .disclaimer{max-width:640px;margin:0 auto 1.2rem;font-size:.78rem;color:var(--creme-40);line-height:1.7}
  footer .mono{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--creme-40)}

  /* pausa as animações do hero quando ele não está visível (economiza GPU no resto da página) */
  header.hero.pausado *,
  header.hero.pausado *::before,
  header.hero.pausado *::after{animation-play-state:paused !important}

  /* ============ MOVIMENTO REDUZIDO ============ */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    .ticker__faixa{transform:none}
    .sol{transform:translateX(-50%) translateY(8%)}
    .revela,.subir{opacity:1;transform:none}
    .cronologia::before,.secao__cabeca h2::after{transform:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
