<main class="artigo guia" data-guia="{{__guia_id__}}">
  <div class="local__trilha" role="navigation" aria-label="{{gd00}}">
    <a href="{{__guides__}}">{{gd00}}</a><span aria-hidden="true">›</span><span>{{__guia_curto__}}</span>
  </div>
  <article>
    <p class="artigo__meta"><span class="selo selo--guia">{{gd15}}</span><span class="artigo__autor">{{gd01}} <a href="{{__link_sobre__}}#editor" rel="author">{{__autor__}}</a></span><span>{{gd02}} <time datetime="{{__guia_iso__}}">{{__guia_data__}}</time></span><span class="artigo__leitura">{{__guia_leitura__}}</span></p>
    <h1>{{__guia_titulo__}}</h1>
    <p class="guia__lead">{{__guia_lead__}}</p>
{{__guia_indice__}}
    <div class="artigo__corpo">
{{__guia_html__}}
    </div>
    <aside class="guia__autor" id="autor"><strong>{{__autor__}}</strong> — {{gd16}}</aside>
  </article>

  <div class="compartilhar">
    <span class="compartilhar__rotulo">{{ar03}}</span>
    <a class="zap" href="https://wa.me/?text={{__art_share_txt__}}" target="_blank" rel="noopener" data-rede="whatsapp">WhatsApp</a>
    <a href="https://x.com/intent/post?text={{__art_share_titulo__}}&amp;url={{__art_share_url__}}&amp;via=vvviceversaa" target="_blank" rel="noopener" data-rede="x">X</a>
    <a href="https://t.me/share/url?url={{__art_share_url__}}&amp;text={{__art_share_titulo__}}" target="_blank" rel="noopener" data-rede="telegram">Telegram</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{__art_share_url__}}" target="_blank" rel="noopener" data-rede="facebook">Facebook</a>
    <button type="button" data-copiar="{{__canonical__}}" data-ok="{{ar05}}">{{ar04}}</button>
    <button type="button" data-compartilhar="{{__canonical__}}" aria-label="{{ar03}}">↗</button>
  </div>

  <section class="artigo__mais" style="padding:0 0 4rem">
    <div class="secao__cabeca"><h2>{{gd05}}</h2></div>
    <ul class="guias__lista">
{{__guia_outros__}}
    </ul>
  </section>
</main>
