name: Novo post
description: Publica um card no site e gera o link pronto para o X
title: "Título do post aqui"
labels: ["post"]
body:
  - type: markdown
    attributes:
      value: |
        O **título** desta Issue vira o título do card no site e a primeira
        linha do post no X. Escreva ele no campo lá em cima.

        Cada post ganha uma **página própria** no site (vvviceversa.com/news/...),
        e é ela que aparece no Google. Por isso, prefira títulos que digam o fato:
        "Stephen Root confirma que dubla Brian Heder em GTA 6" funciona muito
        melhor na busca do que "Confirmed!". A primeira frase do texto vira o
        resumo que aparece no Google e nos compartilhamentos.

        O endereço da página é criado com a data, o título e o começo do texto.
        Evite mudar o título depois de divulgar o link.

        **Português e espanhol (opcional):** preencha os campos traduzidos e a
        notícia ganha também uma página em /pt/noticias/... e /es/noticias/...
        — que é a que o leitor brasileiro ou hispânico encontra no Google.
        Precisa preencher título E texto do idioma; campo em branco = a página
        daquele idioma mostra a versão em inglês. As traduções não vão para o X.

  - type: textarea
    id: texto
    attributes:
      label: Texto do post
      description: >
        Aparece no card do site e no post do X. Para caber no X, título e texto
        somados devem ficar em até 280 caracteres — o robô avisa se passar.
        PARA ADICIONAR IMAGEM: arraste o arquivo para dentro deste campo. Ela
        aparece no card do site automaticamente. No X, você precisa anexá-la à
        mão na hora de publicar.
      placeholder: Vehicles become your mini depot for weapons and items.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status da notícia
      description: >
        Vira um selo colorido no card e na página da notícia. Confirmado =
        anúncio oficial da Rockstar/Take-Two ou de alguém envolvido (ex.: ator
        confirmando o papel). Rumor = ainda não confirmado. Vazamento =
        informação vazada (nunca mostramos nem linkamos o material). Para
        trocar depois, adicione na Issue o rótulo confirmado, rumor ou
        vazamento: o rótulo tem prioridade sobre este campo.
      options:
        - Confirmado
        - Rumor
        - Vazamento
    validations:
      required: true

  - type: input
    id: titulo_pt
    attributes:
      label: Título em português (opcional)
      description: Título da página em português. Diga o fato, como no título principal.
      placeholder: Stephen Root confirma que dubla Brian Heder em GTA 6
    validations:
      required: false

  - type: textarea
    id: texto_pt
    attributes:
      label: Texto em português (opcional)
      description: >
        Texto da página em português. Sem limite de tamanho — aqui pode
        desenvolver mais do que no X. Se não colocar imagem, a página usa a
        primeira imagem do texto principal.
    validations:
      required: false

  - type: input
    id: titulo_es
    attributes:
      label: Título en español (opcional)
      placeholder: Stephen Root confirma que da voz a Brian Heder en GTA 6
    validations:
      required: false

  - type: textarea
    id: texto_es
    attributes:
      label: Texto en español (opcional)
    validations:
      required: false

  - type: input
    id: link_x
    attributes:
      label: Link do post no X (opcional)
      description: >
        Deixe em branco agora. Depois de publicar no X, volte aqui e cole o link
        para o card do site apontar para o tweet.
      placeholder: https://x.com/vvviceversaa/status/123456789
    validations:
      required: false
