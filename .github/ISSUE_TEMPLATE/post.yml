name: Novo post
description: Publica um card no site e gera o link pronto para o X
title: "Título do post aqui"
labels: ["post"]
body:
  - type: markdown
    attributes:
      value: |
        O **título** desta Issue vira o título do card no site e a primeira
        linha do post no X. Escreva ele no campo lá em cima.

        Cada post ganha uma **página própria** no site (vvviceversa.com/news/...),
        e é ela que aparece no Google. Por isso, prefira títulos que digam o fato:
        "Stephen Root confirma que dubla Brian Heder em GTA 6" funciona muito
        melhor na busca do que "Confirmed!". A primeira frase do texto vira o
        resumo que aparece no Google e nos compartilhamentos.

        O endereço da página é criado com a data, o título e o começo do texto.
        Evite mudar o título depois de divulgar o link.

        **Qualidade (Google AdSense):** notícia com menos de 120 palavras fica
        FORA do Google (noindex) — o Google trata páginas curtas como "conteúdo
        de baixo valor" e isso bloqueia a aprovação de anúncios. Use o campo
        **Matéria completa** para escrever a versão do site: contexto, o que foi
        anunciado, o que isso muda para o jogador e o que ainda não se sabe
        (ideal: 250 palavras ou mais). Sempre preencha a **Fonte**.

        **Padrão VICEVERSA (obrigatório):** toda notícia leva **pelo menos 2
        fontes independentes** e o **Aprofundamento** — contexto, o que se sabe,
        o que ainda não se sabe e a análise do VICEVERSA. Ele aparece no fim da
        matéria, com títulos próprios, e é o que diferencia o site de quem só
        repete a fonte. O robô avisa no comentário se faltar alguma coisa.

        **Português e espanhol (opcional):** preencha os campos traduzidos e a
        notícia ganha também uma página em /pt/noticias/... e /es/noticias/...
        — que é a que o leitor brasileiro ou hispânico encontra no Google.
        Precisa preencher título E texto do idioma; campo em branco = a página
        daquele idioma mostra a versão em inglês. As traduções não vão para o X.

  - type: textarea
    id: texto
    attributes:
      label: Texto do post
      description: >
        Aparece no card do site e no post do X. Para caber no X, título e texto
        somados devem ficar em até 280 caracteres — o robô avisa se passar.
        PARA ADICIONAR IMAGEM: arraste o arquivo para dentro deste campo. Ela
        aparece no card do site automaticamente. No X, você precisa anexá-la à
        mão na hora de publicar.
      placeholder: Vehicles become your mini depot for weapons and items.
    validations:
      required: true

  - type: textarea
    id: materia
    attributes:
      label: Matéria completa para o site (recomendado)
      description: >
        A versão longa da notícia, que aparece na página do site e no Google.
        Se ficar em branco, o site usa o "Texto do post" (curto demais para o
        Google). Explique o contexto, o que foi confirmado, por que importa e o
        que ainda não se sabe. Pode usar subtítulos (###), listas e imagens.
        Não vai para o X. Mínimo para entrar no Google: 120 palavras.
    validations:
      required: false

  - type: textarea
    id: fonte
    attributes:
      label: Fontes
      description: >
        Links de onde veio a informação — um por linha, PELO MENOS DOIS, de
        veículos diferentes. Prefira a fonte original (Rockstar Newswire,
        perfil oficial, entrevista, veículo que deu a notícia primeiro) e
        confirme em um segundo veículo sério. Não use o site de quem vazou,
        Reddit ou post solto no X como única fonte. Aparece no fim da matéria
        como "Fontes".
      placeholder: https://www.rockstargames.com/newswire/...
    validations:
      required: true

  - type: textarea
    id: aprofundamento_en
    attributes:
      label: Aprofundamento (inglês)
      description: >
        Contexto, o que se sabe, o que ainda não se sabe e a análise do VICEVERSA, em inglês. Escreva embaixo de cada subtítulo (não apague os subtítulos que começam com ####). As instruções entre <!-- --> não aparecem no site. Ideal: 350 a 450 palavras no total.
      value: |
        #### Context
        <!-- 1 or 2 paragraphs: what came before, why it matters, how it connects to earlier news. -->

        #### What we know
        <!-- One fact per line, starting with '- '. Only what is official or confirmed by 2+ outlets. -->
        - 

        #### What we don't know yet
        <!-- One open question or unconfirmed claim per line, starting with '- '. -->
        - 

        #### VICEVERSA's take
        <!-- 2 paragraphs with our opinion: what it means for players, how credible it is, what to watch next. -->
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status da notícia
      description: >
        Vira um selo colorido no card e na página da notícia. Confirmado =
        anúncio oficial da Rockstar/Take-Two ou de alguém envolvido (ex.: ator
        confirmando o papel). Rumor = ainda não confirmado. Vazamento =
        informação vazada (nunca mostramos nem linkamos o material). Para
        trocar depois, adicione na Issue o rótulo confirmado, rumor ou
        vazamento: o rótulo tem prioridade sobre este campo.
      options:
        - Confirmado
        - Rumor
        - Vazamento
    validations:
      required: true

  - type: dropdown
    id: assunto
    attributes:
      label: Assunto da notícia
      description: >
        "Off" = a notícia NÃO é sobre GTA 6 (outro jogo, Rockstar em geral,
        indústria). Ela ganha o selo OFF no site, aparece no filtro "Off" da
        página de notícias e o título da página não leva "GTA VI". O selo de
        status (Confirmado / Rumor / Vazamento) continua valendo junto. Para
        marcar uma notícia antiga como off, basta adicionar o rótulo off na Issue.
      options:
        - GTA 6
        - Off — outro jogo ou assunto
      default: 0
    validations:
      required: true

  - type: input
    id: titulo_pt
    attributes:
      label: Título em português (opcional)
      description: Título da página em português. Diga o fato, como no título principal.
      placeholder: Stephen Root confirma que dubla Brian Heder em GTA 6
    validations:
      required: false

  - type: textarea
    id: texto_pt
    attributes:
      label: Texto em português (opcional)
      description: >
        Texto da página em português. Sem limite de tamanho — aqui pode
        desenvolver mais do que no X. Se não colocar imagem, a página usa a
        primeira imagem do texto principal.
    validations:
      required: false

  - type: textarea
    id: aprofundamento_pt
    attributes:
      label: Aprofundamento em português (opcional)
      description: >
        O mesmo aprofundamento, em português. Se ficar em branco, a página em português fica sem essas seções.
      value: |
        #### Contexto
        <!-- 1 ou 2 parágrafos: o que veio antes, por que importa, como se liga a outras notícias. -->

        #### O que se sabe
        <!-- Um fato por linha, começando com '- '. Só o que é oficial ou confirmado por 2+ veículos. -->
        - 

        #### O que ainda não se sabe
        <!-- Uma dúvida ou alegação não confirmada por linha, começando com '- '. -->
        - 

        #### A análise do VICEVERSA
        <!-- 2 parágrafos com a nossa opinião: o que muda para o jogador, se é crível, o que observar. -->
    validations:
      required: false

  - type: input
    id: titulo_es
    attributes:
      label: Título en español (opcional)
      placeholder: Stephen Root confirma que da voz a Brian Heder en GTA 6
    validations:
      required: false

  - type: textarea
    id: texto_es
    attributes:
      label: Texto en español (opcional)
    validations:
      required: false

  - type: textarea
    id: aprofundamento_es
    attributes:
      label: Aprofundamento en español (opcional)
      description: >
        O mesmo aprofundamento, em espanhol.
      value: |
        #### Contexto
        <!-- 1 o 2 párrafos: qué pasó antes, por qué importa, cómo se conecta con otras noticias. -->

        #### Lo que se sabe
        <!-- Un hecho por línea, empezando con '- '. Solo lo oficial o confirmado por 2+ medios. -->
        - 

        #### Lo que aún no se sabe
        <!-- Una duda o afirmación no confirmada por línea, empezando con '- '. -->
        - 

        #### El análisis de VICEVERSA
        <!-- 2 párrafos con nuestra opinión: qué cambia para el jugador, si es creíble, qué observar. -->
    validations:
      required: false

  - type: input
    id: link_x
    attributes:
      label: Link do post no X (opcional)
      description: >
        Deixe em branco agora. Depois de publicar no X, volte aqui e cole o link
        para o card do site apontar para o tweet.
      placeholder: https://x.com/vvviceversaa/status/123456789
    validations:
      required: false
