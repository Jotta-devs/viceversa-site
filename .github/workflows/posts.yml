name: Publicar posts (Issues + X -> site)

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  schedule:
    - cron: "0 */6 * * *"    # rede de segurança, caso um evento de Issue falhe
  workflow_dispatch:
  # regera o site sozinho quando os textos, guias ou o gerador mudam
  # (o commit do robô usa o GITHUB_TOKEN e não dispara o workflow de novo)
  push:
    branches: [main]
    paths:
      - "montar.py"
      - "guias/**"
      - "paginas/**"
      - "partes/**"
      - "idiomas/**"
      - "institucional/**"
      - "mapa/pontos.json"

concurrency:
  group: publicar-posts
  cancel-in-progress: false

permissions:
  contents: write
  issues: write     # para comentar o botão na Issue

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # sempre a versão mais nova do main: uma rodada que esperou na fila não
      # pode partir do commit de quando a Issue foi editada (já desatualizado)
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pillow: reduz as fotos das notícias (WebP) e desenha a imagem de
      # compartilhamento de cada notícia e de cada local do mapa
      - name: Instalar o Pillow
        run: pip install --quiet pillow

      # Fonte confiável: as Issues. Monta a base do feed.
      - name: Ler as Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python automacao/posts.py

      # Comenta na Issue com o link que abre o X já preenchido. Custo zero:
      # não usa a API paga do X, só o endpoint público de intenção.
      - name: Gerar o botão de publicação no X
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python automacao/botao-x.py

      - name: Regerar o site
        run: python montar.py

      - name: Publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "viceversa-bot"
          git config user.email "bot@viceversa"
          for tentativa in 1 2 3; do
            git add feed.json slugs.json midia/ docs/
            if git diff --cached --quiet; then
              echo "nada mudou, nada a publicar."
              exit 0
            fi
            git commit -q -m "posts: atualiza o painel de noticias"
            if git push; then
              echo "publicado."
              exit 0
            fi
            # outro commit chegou ao main enquanto isto rodava. Mesclar arquivos
            # gerados sempre dá conflito; em vez disso, parte da versão mais nova
            # e gera tudo de novo a partir das Issues (que são a fonte de verdade)
            echo "tentativa $tentativa: o main mudou; gerando de novo sobre a versão mais nova..."
            git fetch -q origin main
            git reset -q --hard origin/main
            python automacao/posts.py
            python montar.py
          done
          echo "nao consegui publicar apos 3 tentativas."
          exit 1
